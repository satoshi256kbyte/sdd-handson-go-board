<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoBoard</title>
  <style>
    /* ===================================================================
       GoBoard スタイル
       UI 層（表示・入力）の見た目を定義する。ビジネスロジックには依存しない。
       盤面描画・ステータス表示の詳細スタイルは後続タスクで拡充する。
       =================================================================== */
    :root {
      --gb-bg: #f5f0e1;
      --gb-line: #8a6d3b;
      --gb-text: #2b2b2b;
      --gb-board-bg: #e8c27a;
      --gb-cell: 32px;
      --gb-stone-black: #1c1c1c;
      --gb-stone-white: #fafafa;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--gb-bg);
      color: var(--gb-text);
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.5rem;
    }

    /* --- ステータス表示 --- */
    #gb-status {
      margin: 12px 0;
      min-height: 1.4em;
      font-weight: 600;
    }

    /* --- 着手拒否などの通知表示 ---
       着手が拒否された理由（既に石がある・対局終了済み等）を一時的に伝える。
       内容が無い間は高さを持たせず、正常な着手のたびにクリアされる。 */
    #gb-notice {
      margin: 12px 0;
      min-height: 1.4em;
      color: #a12a2a;
      font-weight: 600;
    }

    /* --- 盤面（15×15 の交点をグリッドで描画） ---
       各セル（交点）を CSS グリッドで並べ、セル内に格子線を疑似要素で描く。
       中央の丸で石（黒・白）を表現する。DOM 構造は UI コントローラが生成する。 */
    #gb-board {
      display: inline-grid;
      grid-template-columns: repeat(15, var(--gb-cell));
      grid-template-rows: repeat(15, var(--gb-cell));
      background: var(--gb-board-bg);
      padding: calc(var(--gb-cell) / 2);
      border: 2px solid var(--gb-line);
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .gb-cell {
      position: relative;
      width: var(--gb-cell);
      height: var(--gb-cell);
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      box-sizing: border-box;
    }

    /* 横方向の格子線（セル中央を水平に通す）。 */
    .gb-cell::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--gb-line);
      transform: translateY(-0.5px);
    }

    /* 縦方向の格子線（セル中央を垂直に通す）。 */
    .gb-cell::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 100%;
      background: var(--gb-line);
      transform: translateX(-0.5px);
    }

    /* 盤の端では線が交点の外へはみ出さないよう半分に切る。 */
    .gb-cell[data-col="0"]::before { left: 50%; width: 50%; }
    .gb-cell[data-col="14"]::before { width: 50%; }
    .gb-cell[data-row="0"]::after { top: 50%; height: 50%; }
    .gb-cell[data-row="14"]::after { height: 50%; }

    /* 石（黒・白）。交点中央に円で重ねる。 */
    .gb-stone {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 78%;
      height: 78%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .gb-stone-black {
      background: radial-gradient(circle at 35% 30%, #555, var(--gb-stone-black) 70%);
    }

    .gb-stone-white {
      background: radial-gradient(circle at 35% 30%, #fff, #d0d0d0 80%);
      border: 1px solid #b5b5b5;
    }
  </style>
</head>
<body>
  <h1>GoBoard</h1>
  <div id="gb-status"></div>
  <div id="gb-board"></div>
  <div id="gb-notice" role="alert" aria-live="polite"></div>

  <script>
    'use strict';

    /* ===================================================================
       GoBoard
       単一 HTML ファイルで完結する実装。
       - ビジネスロジックは GoBoardLogic 名前空間の純粋関数として DOM から分離する。
       - テストランナーおよび UI コントローラは後続タスクで実装する。
       =================================================================== */

    /* -------------------------------------------------------------------
       Data Models（データモデル定数）
       ------------------------------------------------------------------- */

    /**
     * 石および手番の色。
     * @readonly
     */
    const Color = Object.freeze({
      BLACK: 'BLACK',
      WHITE: 'WHITE',
    });

    /**
     * 各交点（Intersection）の状態。「空」を含む。
     * @readonly
     */
    const CellState = Object.freeze({
      EMPTY: 'EMPTY',
      BLACK: 'BLACK',
      WHITE: 'WHITE',
    });

    /**
     * ゲームの進行状態（Game_Status）。
     * @readonly
     */
    const GameStatus = Object.freeze({
      IN_PROGRESS: 'IN_PROGRESS',
      BLACK_WIN: 'BLACK_WIN',
      WHITE_WIN: 'WHITE_WIN',
      DRAW: 'DRAW',
    });

    /** 盤面の一辺の交点数（15×15 = 225 交点）。 */
    const BOARD_SIZE = 15;

    /** 勝利に必要な同色連続数。 */
    const WIN_LENGTH = 5;

    /** Three_In_A_Row を構成する同色連続数（ちょうど 3 個）。 */
    const THREE_LENGTH = 3;

    /**
     * 勝敗判定で走査する 4 方向。
     * 各方向について起点から両側の同色連続数を数える。
     * @readonly
     */
    const DIRECTIONS = Object.freeze([
      Object.freeze({ dr: 0, dc: 1 }),   // 横
      Object.freeze({ dr: 1, dc: 0 }),   // 縦
      Object.freeze({ dr: 1, dc: 1 }),   // 右下がり斜め
      Object.freeze({ dr: 1, dc: -1 }),  // 右上がり斜め
    ]);

    /**
     * 着手が無効だったときの理由コード。
     * @readonly
     */
    const InvalidReason = Object.freeze({
      OCCUPIED: 'OCCUPIED',                     // 既に石がある交点への着手
      OUT_OF_BOUNDS: 'OUT_OF_BOUNDS',           // 行または列が 0〜14 の範囲外
      INVALID_COORDINATE: 'INVALID_COORDINATE', // 行または列が整数でない値
      NOT_IN_PROGRESS: 'NOT_IN_PROGRESS',       // ゲームが進行中でない状態での着手
      DOUBLE_THREE: 'DOUBLE_THREE',             // Black_Player の着手が Double_Three を成立させる
    });

    /* -------------------------------------------------------------------
       GoBoardLogic（ビジネスロジック層 / DOM 非依存の純粋関数群）
       すべての関数は入力状態を変更せず、新しい値を返す。
       ------------------------------------------------------------------- */
    const GoBoardLogic = (function () {

      /**
       * 新しいゲーム状態を生成する。
       * 既存状態に依存せず、常に同一の初期状態を返す。
       * - board: 全 225 交点が CellState.EMPTY
       * - currentTurn: Color.BLACK（先手は黒）
       * - status: GameStatus.IN_PROGRESS
       * @returns {{board: string[][], currentTurn: string, status: string}} 初期 GameState
       */
      function createGame() {
        const board = [];
        for (let row = 0; row < BOARD_SIZE; row++) {
          const cells = [];
          for (let col = 0; col < BOARD_SIZE; col++) {
            cells.push(CellState.EMPTY);
          }
          board.push(cells);
        }
        return {
          board: board,
          currentTurn: Color.BLACK,
          status: GameStatus.IN_PROGRESS,
        };
      }

      /**
       * 手番の色を他方に切り替えた色を返す純粋関数。
       * @param {string} turn 現在の手番の色（Color）
       * @returns {string} 他方の色
       */
      function nextTurn(turn) {
        return turn === Color.BLACK ? Color.WHITE : Color.BLACK;
      }

      /* --- 以下は後続タスクで実装するプレースホルダ ------------------- */

      /**
       * 座標が盤内かつ整数であるかを検証する。
       * row・col がいずれも整数で、かつ 0〜(BOARD_SIZE - 1) の範囲に収まるときのみ true を返す。
       * 小数・NaN・null・undefined・数値以外の型（文字列・真偽値・オブジェクト等）は
       * Number.isInteger による型／整数チェックで弾かれ、範囲外の整数も false となる。
       * @param {number} row 行番号
       * @param {number} col 列番号
       * @returns {boolean} 有効な座標なら true
       */
      function isValidCoordinate(row, col) {
        return (
          Number.isInteger(row) &&
          Number.isInteger(col) &&
          row >= 0 &&
          row < BOARD_SIZE &&
          col >= 0 &&
          col < BOARD_SIZE
        );
      }

      /**
       * 指定した交点を起点に、その交点の石の色で 5 連が成立しているか判定する。
       * 起点セルが空（CellState.EMPTY）の場合は勝利なしとして false を返す。
       * 4 方向（横・縦・右下がり斜め・右上がり斜め）それぞれについて、起点から
       * 正負両側に連続する同色の石を数え、起点自身を含めた合計が WIN_LENGTH 以上に
       * なる方向が 1 つでもあれば true を返す。走査は盤内の同色セルに限る。
       * @param {string[][]} board 盤面
       * @param {number} row 起点の行
       * @param {number} col 起点の列
       * @returns {boolean} 5 連が成立していれば true
       */
      function checkWin(board, row, col) {
        const color = board[row][col];
        if (color === CellState.EMPTY) {
          return false;
        }
        for (let i = 0; i < DIRECTIONS.length; i++) {
          const dr = DIRECTIONS[i].dr;
          const dc = DIRECTIONS[i].dc;
          let count = 1; // 起点自身
          // 正方向へ連続する同色を数える
          let r = row + dr;
          let c = col + dc;
          while (isValidCoordinate(r, c) && board[r][c] === color) {
            count++;
            r += dr;
            c += dc;
          }
          // 負方向へ連続する同色を数える
          r = row - dr;
          c = col - dc;
          while (isValidCoordinate(r, c) && board[r][c] === color) {
            count++;
            r -= dr;
            c -= dc;
          }
          if (count >= WIN_LENGTH) {
            return true;
          }
        }
        return false;
      }

      /**
       * 盤面上のすべての交点が石で埋まっているか判定する。
       * 225 交点のいずれかが CellState.EMPTY であれば false、
       * 空の交点が 1 つも無ければ true を返す。
       * @param {string[][]} board 盤面
       * @returns {boolean} 全交点が埋まっていれば true
       */
      function isBoardFull(board) {
        for (let row = 0; row < BOARD_SIZE; row++) {
          for (let col = 0; col < BOARD_SIZE; col++) {
            if (board[row][col] === CellState.EMPTY) {
              return false;
            }
          }
        }
        return true;
      }

      /**
       * 指定した交点に現在の手番の石を置こうと試みる。
       * 入力状態は変更せず（イミュータブル）、着手の可否・無効理由・結果状態を含む
       * MoveResult を返す。検証は次の順序で行う。
       * 1. status が IN_PROGRESS でなければ reason=NOT_IN_PROGRESS。
       * 2. 座標が無効なら、row・col がともに整数だが範囲外の場合のみ
       *    reason=OUT_OF_BOUNDS、それ以外（小数・NaN・null・undefined・非数値型）は
       *    reason=INVALID_COORDINATE。
       * 3. 対象交点が空でなければ reason=OCCUPIED。
       * 4. 有効な場合は盤面を複製して手番の色を置き、勝敗・引き分け・継続の
       *    いずれかへ status を更新する。継続時のみ手番を切り替え、ゲーム終了時は
       *    着手したプレイヤーの手番を保持する。
       * 無効な着手では state を入力と内容が等しい状態として返し、入力は破壊しない。
       * @param {{board: string[][], currentTurn: string, status: string}} state 現在のゲーム状態
       * @param {number} row 行番号
       * @param {number} col 列番号
       * @returns {{valid: boolean, reason: string|null, state: object}} MoveResult
       */
      function placeStone(state, row, col) {
        // 1. ゲームが進行中でなければ着手不可。入力状態は変更しない。
        if (state.status !== GameStatus.IN_PROGRESS) {
          return { valid: false, reason: InvalidReason.NOT_IN_PROGRESS, state: state };
        }

        // 2. 座標が無効な場合の理由判定。
        //    row・col がともに整数だが盤外 → OUT_OF_BOUNDS、
        //    それ以外（小数・NaN・null・undefined・非数値型など） → INVALID_COORDINATE。
        if (!isValidCoordinate(row, col)) {
          const reason = (Number.isInteger(row) && Number.isInteger(col))
            ? InvalidReason.OUT_OF_BOUNDS
            : InvalidReason.INVALID_COORDINATE;
          return { valid: false, reason: reason, state: state };
        }

        // 3. 対象交点が既に埋まっていれば着手不可。
        if (state.board[row][col] !== CellState.EMPTY) {
          return { valid: false, reason: InvalidReason.OCCUPIED, state: state };
        }

        // 4. 有効な着手。盤面を複製（行ごとにコピー）し、手番の色を置く。
        const placedColor = state.currentTurn;
        const placedCellState = placedColor === Color.BLACK ? CellState.BLACK : CellState.WHITE;
        const newBoard = state.board.map(function (cells) {
          return cells.slice();
        });
        newBoard[row][col] = placedCellState;

        // status を更新する。勝利 > 引き分け > 継続 の順で判定する。
        let newStatus;
        if (checkWin(newBoard, row, col)) {
          newStatus = placedColor === Color.BLACK ? GameStatus.BLACK_WIN : GameStatus.WHITE_WIN;
        } else if (isBoardFull(newBoard)) {
          newStatus = GameStatus.DRAW;
        } else {
          newStatus = GameStatus.IN_PROGRESS;
        }

        // 継続中のみ手番を切り替える。ゲーム終了時は着手者の手番を保持する。
        const newCurrentTurn = newStatus === GameStatus.IN_PROGRESS
          ? nextTurn(placedColor)
          : placedColor;

        return {
          valid: true,
          reason: null,
          state: {
            board: newBoard,
            currentTurn: newCurrentTurn,
            status: newStatus,
          },
        };
      }

      /* --- Open_Three 検出（連続3の同時成立の判定の中核・DOM 非依存の純粋関数） ------
         着手交点を含む Open_Three が各 Line 方向で成立しているかを判定する。
         design.md「Open_Three 検出アルゴリズム」に対応する。 */

      /**
       * 指定した交点 (row, col) が盤内かつ指定色の石であるかを返す補助関数。
       * 盤外・空・相手色はいずれも false。
       * @param {string[][]} board 盤面
       * @param {number} row 行
       * @param {number} col 列
       * @param {string} cell 期待する CellState（BLACK / WHITE）
       * @returns {boolean} 盤内かつ指定色なら true
       */
      function isCell(board, row, col, cell) {
        return isValidCoordinate(row, col) && board[row][col] === cell;
      }

      /**
       * 指定した交点 (row, col) が盤内かつ空であるかを返す補助関数。
       * @param {string[][]} board 盤面
       * @param {number} row 行
       * @param {number} col 列
       * @returns {boolean} 盤内かつ空なら true
       */
      function isEmptyCell(board, row, col) {
        return isValidCoordinate(row, col) && board[row][col] === CellState.EMPTY;
      }

      /* --- Open_Three 列挙と Three_Registry 再計算（DOM 非依存の純粋関数） ---
         盤面全体を走査し、指定色の Open_Three（同色ちょうど 3 個「連続」しかつ
         少なくとも一方の端が開いて延長可能な並び ●●●）を列挙する。飛び三（●●_●）
         および両端が塞がれた連続 3 は含めない。Three_In_A_Row は本仕様では Open_Three
         と同義であり、以降のログ表記も同じ意味で用いる。design.md「Three_Registry の
         正規化と再計算」に対応する。 */

      /**
       * Open_Three を構成する 3 交点の座標列から、重複排除用の正規化キーを作る。
       * 座標列を (row, col) の辞書順で昇順ソートし、その並びを文字列化する。
       * Open_Three は連続 3 のみで内部に空 Intersection を含まない（石のある 3 交点のみ）。
       * 走査の起点や方向の取り方によらず、同一の 3 石集合は同一のキーを持つ。
       * @param {{row:number, col:number}[]} cells 構成する 3 交点（順不同）
       * @returns {{cells:{row:number,col:number}[], key:string}} 正規化済み交点列とキー
       */
      function normalizeThreeCells(cells) {
        const sorted = cells.slice().sort(function (a, b) {
          if (a.row !== b.row) {
            return a.row - b.row;
          }
          return a.col - b.col;
        });
        const key = sorted
          .map(function (p) { return p.row + ',' + p.col; })
          .join('|');
        return { cells: sorted, key: key };
      }

      /**
       * 盤面全体を走査し、指定色の Open_Three（同色ちょうど 3 個「連続」しかつ
       * 延長可能な開いた端を持つ並び ●●●）の位置集合を返す。盤面は変更しない。
       *
       * design.md「Open_Three 検出アルゴリズム」に準拠する。判定は次の 2 段階で行う。
       * 1. 連続 3 の窓の抽出: 各起点 (r, c) から方向 (dr, dc) へ 3 マス連続して
       *    同色の窓 (p0, p1, p2) のみを候補とする。飛び三（●●_●）は候補としない。
       * 2. 端の延長可能性（Open 条件）: 窓の前端外側 before(= p0 の一つ手前) と
       *    後端外側 after(= p2 の一つ次) のうち少なくとも一方が「盤内かつ空」であれば、
       *    その端へ延長して同色 4 連を作り得るため Open_Three とみなす。前端外側・
       *    後端外側がいずれも相手 Stone または盤端で塞がれている連続 3 は除外する。
       *
       * 各方向は順方向 (dr, dc) のみを起点走査に用いる（反対向きは同一 Line の重複と
       * なるため）。抽出した 3 石は構成 3 交点を辞書順昇順に正規化した key で一意化し、
       * 重複を排除して返す。「1 本の Line 上の連続 3 ＋ 端の延長可能性」の判定ロジックは
       * 本関数内にインラインで実装する（旧 detectOpenThrees の着手点ベース版は廃止済み）。
       *
       * @param {string[][]} board 走査対象の盤面
       * @param {string} color 対象の色（Color.BLACK / Color.WHITE）
       * @returns {{color:string, cells:{row:number,col:number}[], key:string}[]}
       *          重複を含まない Open_Three の配列
       */
      function findOpenThrees(board, color) {
        const cell = color === Color.BLACK ? CellState.BLACK : CellState.WHITE;
        const seen = Object.create(null);
        const result = [];

        const isColorAt = function (r, c) {
          return isCell(board, r, c, cell);
        };
        const isEmptyAt = function (r, c) {
          return isEmptyCell(board, r, c);
        };
        const addOpenThree = function (p0, p1, p2) {
          const normalized = normalizeThreeCells([p0, p1, p2]);
          if (seen[normalized.key]) {
            return;
          }
          seen[normalized.key] = true;
          result.push({
            color: color,
            cells: normalized.cells,
            key: normalized.key,
          });
        };

        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            for (let d = 0; d < DIRECTIONS.length; d++) {
              const dr = DIRECTIONS[d].dr;
              const dc = DIRECTIONS[d].dc;
              // オフセット k の交点座標。
              const rowAt = function (k) { return r + k * dr; };
              const colAt = function (k) { return c + k * dc; };

              // 1. 連続 3 の窓の抽出: [k=0, 1, 2] がすべて同色 (●●●)。
              //    飛び三は候補にしない（連続 3 のみ）。
              if (
                !(isColorAt(rowAt(0), colAt(0)) &&
                  isColorAt(rowAt(1), colAt(1)) &&
                  isColorAt(rowAt(2), colAt(2)))
              ) {
                continue;
              }

              // 2. 端の延長可能性: 前端外側 (k=-1) と後端外側 (k=3) のうち
              //    少なくとも一方が盤内かつ空であれば延長して 4 連を作り得る。
              //    両端が相手 Stone・盤端で塞がれた連続 3 は Open_Three ではない。
              const beforeEmpty = isEmptyAt(rowAt(-1), colAt(-1));
              const afterEmpty = isEmptyAt(rowAt(3), colAt(3));
              if (!beforeEmpty && !afterEmpty) {
                continue;
              }

              // 3. 正規化して重複排除しつつ登録する。
              addOpenThree(
                { row: rowAt(0), col: colAt(0) },
                { row: rowAt(1), col: colAt(1) },
                { row: rowAt(2), col: colAt(2) }
              );
            }
          }
        }

        return result;
      }

      /**
       * 確定後の盤面から黒・白それぞれの Open_Three 位置集合を再計算し、
       * Three_Registry を新規に構築して返す。黒・白それぞれについて
       * findOpenThrees(board, color) を呼び、その結果で { black, white } を
       * 新規構築する。findOpenThrees は key で重複排除済みのため、追加の
       * 重複排除は不要である。盤面は変更せず、既存の Three_Registry も
       * 参照しないため、確定後盤面に対して毎回同じ結果を返す。黒・白は区別して
       * 保持し、各集合内に同一の Open_Three（同一キー）を重複して持たない。
       * @param {string[][]} board 確定後の盤面
       * @returns {{black:Object[], white:Object[]}} 黒・白を区別した Three_Registry
       */
      function computeThreeRegistry(board) {
        return {
          black: findOpenThrees(board, Color.BLACK),
          white: findOpenThrees(board, Color.WHITE),
        };
      }

      /**
       * 指定色の Open_Three が盤面全体に 2 個以上存在する（Double_Three か）を判定する。
       *
       * 判定は着手点や方向を参照せず、盤面全体の当該色 Open_Three 総数のみで行う。
       * computeThreeRegistry(board)[colorKey].length >= 2 と論理的に同値であり、
       * 連続3の同時2箇所成立の禁止の判定とログ出力が参照する Three_Registry を唯一の情報源とする。
       * 盤面は変更しない。
       *
       * @param {string[][]} board 判定対象の盤面（着手を反映済みの盤面を渡す）
       * @param {string} color 判定対象の色（Color.BLACK / Color.WHITE）
       * @returns {boolean} 当該色の Open_Three が 2 個以上なら true
       */
      function isDoubleThree(board, color) {
        const colorKey = color === Color.BLACK ? 'black' : 'white';
        return computeThreeRegistry(board)[colorKey].length >= 2;
      }

      /* --- applyMove（連続3の同時2箇所成立の禁止ローカルルールを含む着手ラッパ） ----------
         既存 placeStone を内部で呼び、その有効結果に対してのみ連続3の同時2箇所成立の禁止と
         Three_Registry 再計算を後段で適用する。placeStone 自体は変更しない。
         design.md「Architecture 着手処理の流れ」「Error Handling」に対応する。 */

      /**
       * 連続3の同時2箇所成立の禁止ローカルルールを含めて着手を適用するラッパ。
       *
       * 手順:
       *   1. 既存 placeStone を呼ぶ。無効ならその結果をそのまま伝え、
       *      Three_Registry は着手前盤面から算出した内容（不変）を付す（要件 2.3, 3.4, 4.3）。
       *   2. 有効な場合、着手後 Game_Status が BLACK_WIN なら連続3の同時2箇所成立の禁止を適用せず
       *      勝ちを優先する（要件 1.4）。
       *   3. 着手前手番が Black_Player かつ非 Win_Condition のとき、確定後盤面から
       *      Three_Registry を 1 回だけ再計算し、registry.black.length >= 2 なら
       *      Double_Three として valid=false・reason=DOUBLE_THREE に差し替え、
       *      状態を着手前の state に戻し、Three_Registry も着手前の内容へ戻して返す
       *      （要件 1.1, 1.5, 2.3, 4.1）。禁止判定はこの再計算済み Three_Registry の
       *      黒個数を唯一の情報源として参照する（旧 isDoubleThreeMove は用いない）。
       *   4. それ以外（白の着手・黒で黒 Open_Three が 1 個以下の手）は有効のまま受理し、
       *      同じ再計算済み Three_Registry を LocalMoveResult に含める（要件 1.2, 1.3, 2.2）。
       *
       * 既存 placeStone は変更しない。入力状態は変更しない。
       * @param {Object} state 現在のゲーム状態
       * @param {number} row 行番号
       * @param {number} col 列番号
       * @returns {{valid:boolean, reason:string|null, state:Object, registry:{black:Object[], white:Object[]}}} LocalMoveResult
       */
      function applyMove(state, row, col) {
        // 着手前の手番を確定させておく（placeStone は state を変更しない）。
        const movingColor = state.currentTurn;

        const base = placeStone(state, row, col);

        // 1. placeStone が無効を返した場合は、その結果をそのまま伝える。
        //    Three_Registry は着手前盤面から算出し、着手前のまま変化させない。
        if (!base.valid) {
          return {
            valid: false,
            reason: base.reason,
            state: base.state,
            registry: computeThreeRegistry(state.board),
          };
        }

        // 有効確定に用いる Three_Registry は確定後盤面から 1 回だけ再計算する。
        // この結果を禁止判定（黒個数 >= 2）とログ出力の唯一の情報源とする。
        const registry = computeThreeRegistry(base.state.board);

        // 2. 着手後 Game_Status が BLACK_WIN なら連続3の同時2箇所成立の禁止を適用せず勝ちを優先する。
        const isBlackWin = base.state.status === GameStatus.BLACK_WIN;

        // 3. 着手前手番が黒かつ非 Win_Condition で、確定後盤面全体の黒 Open_Three が
        //    2 個以上（Double_Three）なら拒否する。状態・Three_Registry を着手前へ戻す。
        if (movingColor === Color.BLACK && !isBlackWin &&
            registry.black.length >= 2) {
          return {
            valid: false,
            reason: InvalidReason.DOUBLE_THREE,
            state: state,
            registry: computeThreeRegistry(state.board),
          };
        }

        // 4. 有効確定。再計算済みの Three_Registry をそのまま含める。
        return {
          valid: true,
          reason: null,
          state: base.state,
          registry: registry,
        };
      }

      return {
        createGame: createGame,
        nextTurn: nextTurn,
        isValidCoordinate: isValidCoordinate,
        checkWin: checkWin,
        isBoardFull: isBoardFull,
        placeStone: placeStone,
        findOpenThrees: findOpenThrees,
        isDoubleThree: isDoubleThree,
        computeThreeRegistry: computeThreeRegistry,
        applyMove: applyMove,
      };
    })();

    /* -------------------------------------------------------------------
       Test_Runner（テスト層）
       DOM 非依存のビジネスロジックに対するテストを登録・実行する。

       ここでは後続タスクが拡張する最小のブートストラップのみを用意する。
       - GB_TESTS: 登録済みテストのモジュールレベルレジストリ。
       - test(name, fn): テストを GB_TESTS に登録する。
       - assertEqual(actual, expected, message): 不一致時に期待値・実際値を
         含む Error を投げる（配列・オブジェクトは JSON.stringify で深い比較、
         それ以外は厳密等価で比較）。
       runTests の完全な挙動（同期実行・成否ログ・サマリ出力・例外の非伝播）は
       Task 5.1 で、プロパティ用ジェネレータは Task 5.2 で実装する。
       ------------------------------------------------------------------- */

    /** 登録済みテストのレジストリ。 */
    const GB_TESTS = [];

    /**
     * テストを登録する。実行は runTests()（Task 5.1）が行う。
     * @param {string} name テスト名
     * @param {function(): void} fn テスト本体。失敗時は Error を投げる。
     */
    function test(name, fn) {
      GB_TESTS.push({ name: name, fn: fn });
    }

    /**
     * actual と expected が等しくなければ Error を投げる最小アサーション。
     * 配列・オブジェクトは JSON.stringify による深い比較、
     * それ以外の値は厳密等価（===）で比較する。
     * Task 5.1 で診断出力に合わせて洗練する余地があるが、後方互換を保つ。
     * @param {*} actual 実際の値
     * @param {*} expected 期待値
     * @param {string} [message] 失敗時に付与するメッセージ
     */
    function assertEqual(actual, expected, message) {
      const isCompound = function (v) {
        return v !== null && typeof v === 'object';
      };
      const equal = (isCompound(actual) || isCompound(expected))
        ? JSON.stringify(actual) === JSON.stringify(expected)
        : actual === expected;
      if (!equal) {
        throw new Error(
          (message ? message + ': ' : '') +
          'expected ' + JSON.stringify(expected) +
          ' but got ' + JSON.stringify(actual)
        );
      }
    }

    /**
     * 登録済みの全テスト（GB_TESTS）を登録順に同期実行する。
     * 各テストは try/catch で個別に囲み、1 件でも失敗しても例外を外へ伝播させない。
     * - 成功時: `[PASS] <テスト名>` を 1 行 console.log 出力する。
     * - 失敗時: `[FAIL] <テスト名>` を 1 行出力し、続けて診断情報として
     *   投げられた Error のメッセージ（assertEqual が付与する期待値・実際値を含む）を
     *   `  → <メッセージ>` として出力する。処理は次のテストへ継続する。
     * 全テスト完了後、総数・成功数・失敗数のサマリを 1 行出力する。
     * ページ読み込み時の起動フック配線は Task 7.3 で行う（ここでは定義のみ）。
     * @returns {{total: number, passed: number, failed: number}} 実行結果のサマリ
     */
    function runTests() {
      let passed = 0;
      let failed = 0;

      for (let i = 0; i < GB_TESTS.length; i++) {
        const entry = GB_TESTS[i];
        const name = entry.name;
        try {
          entry.fn();
          passed++;
          console.log('[PASS] ' + name);
        } catch (error) {
          failed++;
          console.log('[FAIL] ' + name);
          // Error 以外が投げられた場合も安全に文字列化する。
          const detail = (error && error.message) ? error.message : String(error);
          console.log('  → ' + detail);
        }
      }

      const total = GB_TESTS.length;
      console.log(
        'GoBoard tests: total=' + total +
        ' passed=' + passed +
        ' failed=' + failed
      );

      return { total: total, passed: passed, failed: failed };
    }

    /* --- 単体テスト（例ベース） -------------------------------------- */

    // 初期化・手番の例ベース単体テスト。
    // createGame() の初期状態（全 225 交点が空・着手済み 0 個、初期手番が黒、

    // 成立しないよう散らばった交点を選び、各着手後に status が進行中のままである

    test('初期盤面: 全 225 交点が空で着手済み 0 個', function () {
      const state = GoBoardLogic.createGame();

      // 15×15 の盤面である。
      assertEqual(state.board.length, BOARD_SIZE, 'board 行数');

      // 全交点が空であることを確認しつつ、置かれた石の数を数える。

      for (let row = 0; row < BOARD_SIZE; row++) {

        for (let col = 0; col < BOARD_SIZE; col++) {

            state.board[row][col],
            CellState.EMPTY,

          if (state.board[row][col] !== CellState.EMPTY) {

    test('初期手番: Current_Turn は黒', function () {

    test('手番の交互切替: 有効着手ごとに黒→白→黒…と切り替わる', function () {
      // 5 連が成立しないよう十分に散らばった交点を順に着手する。
      // 隣接・同一直線上での 5 連続を避けるため、行・列ともに離れたセルを選ぶ。
      const moves = [
        { row: 0, col: 0 },
        { row: 1, col: 3 },
        { row: 2, col: 6 },
        { row: 3, col: 9 },
        { row: 4, col: 12 },
        { row: 5, col: 0 },
        { row: 6, col: 3 },
        { row: 7, col: 6 },
      ];

      let state = GoBoardLogic.createGame();
      let expectedTurn = Color.BLACK; // 初手は黒

      for (let i = 0; i < moves.length; i++) {
        const row = moves[i].row;
        const col = moves[i].col;
        const ctx = '着手' + (i + 1) + '=(' + row + ',' + col + ')';

        // 着手直前の手番は期待どおり交互になっている。
        assertEqual(state.currentTurn, expectedTurn, '着手前の手番 [' + ctx + ']');

        const expectedCell = expectedTurn === Color.BLACK ? CellState.BLACK : CellState.WHITE;
        const result = GoBoardLogic.placeStone(state, row, col);

        // 着手は有効で、置かれた石の色は着手前の手番と一致する。
        assertEqual(result.valid, true, '着手が有効 [' + ctx + ']');
        assertEqual(result.state.board[row][col], expectedCell, '置いた石の色 [' + ctx + ']');

        // 5 連は成立しないため、着手後も進行中のまま。
        assertEqual(
          result.state.status,
          GameStatus.IN_PROGRESS,
          '着手後も進行中 [' + ctx + ']'
        );

        // 進行中なので手番は他方へ切り替わる。
        const nextExpected = expectedTurn === Color.BLACK ? Color.WHITE : Color.BLACK;
        assertEqual(result.state.currentTurn, nextExpected, '着手後の手番が交互 [' + ctx + ']');

        state = result.state;
        expectedTurn = nextExpected;
      }
    });

    // 既石への着手での不変性を確認する。
    // Validates: Requirements 7.14, 7.15, 7.16, 7.17, 7.18, 7.19, 7.20
    test('勝敗判定: 縦の 5 連で黒勝ち', function () {
      // (3,7)〜(7,7) の縦一列に黒 5 連。4 個を事前配置し 5 個目を着手する。
      const state = GoBoardLogic.createGame();
      state.board[3][7] = CellState.BLACK;
      state.board[4][7] = CellState.BLACK;
      state.board[5][7] = CellState.BLACK;

    test('引き分け判定: 満杯かつ無勝者で引き分けになる', function () {
      // Property 7 と同じ剪断パターン color(r,c)=floor((2r+c)/2)%2 で満杯盤面を作る。
      // このパターンは横・縦・両斜めのいずれでも同色は最大 2 連までで 5 連を生じない。
      const patternColorOf = function (row, col) {
        return (Math.floor((2 * row + col) / 2) % 2 === 0)
          ? Color.BLACK
          : Color.WHITE;
      };
      const cellOf = function (row, col) {
        return patternColorOf(row, col) === Color.BLACK
          ? CellState.BLACK
          : CellState.WHITE;
      };

      // 最後の一手前の盤面（(7,7) だけ空）を構成する。
      const fr = 7;
      const fc = 7;
      const finalColor = patternColorOf(fr, fc);
      const preBoard = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        const cells = [];
        for (let c = 0; c < BOARD_SIZE; c++) {
          cells.push((r === fr && c === fc) ? CellState.EMPTY : cellOf(r, c));
        }
        preBoard.push(cells);
      }

      // 実行時ガード: 最後の一手前の盤面は、埋まっている全交点で勝者を含まない。
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (preBoard[r][c] !== CellState.EMPTY) {
            assertEqual(
              GoBoardLogic.checkWin(preBoard, r, c),
              false,
              '最後の一手前は勝者なし (' + r + ',' + c + ')'
            );
          }
        }
      }

      const state = {
        board: preBoard,
        currentTurn: finalColor,
        status: GameStatus.IN_PROGRESS,
      };
      const result = GoBoardLogic.placeStone(state, fr, fc);

      assertEqual(result.valid, true, '最後の着手が有効');
      assertEqual(result.state.status, GameStatus.DRAW, '満杯・無勝者で引き分け');
    });

    /* --- プロパティ用ジェネレータ ------------------------------------ */

    /**
     * プロパティベーステスト向けのランダム入力ジェネレータ群。
     *
     * 外部ライブラリ・CDN を使わず、ブラウザ標準の Math.random のみで
     * 進行中 GameState・空交点・範囲外座標・不正座標・5 連着手列などの
     * ランダム入力を生成する。design.md「ジェネレータの設計要点」に対応する。
     *
     * これは各プロパティテストが最低 100 回のランダム反復を行うための再利用可能な
     * ヘルパであり（要件 7.1）、既存テストが持つ局所ヘルパを置き換えるものではなく、
     * 追加的に利用できる形で提供する。
     *
     * すべてのジェネレータは入力に対して純粋であり、渡された board を変更しない。
     * ただし randomInProgressState は自身で新しい GameState を構築して返す。
     * @namespace GB_GEN
     */
    const GB_GEN = (function () {

      /**
       * 0 以上 n 未満の整数を一様乱数で返す。
       * @param {number} n 上限（この値は含まない）。1 以上の整数を想定する。
       * @returns {number} [0, n) の整数
       */
      function randomInt(n) {
        return Math.floor(Math.random() * n);
      }

      /**
       * 盤面上の空（CellState.EMPTY）の交点を集める内部ヘルパ。
       * 渡された board は変更しない。
       * @param {string[][]} board 盤面
       * @returns {{row: number, col: number}[]} 空交点の座標配列
       */
      function collectEmptyCells(board) {
        const cells = [];
        for (let row = 0; row < BOARD_SIZE; row++) {
          for (let col = 0; col < BOARD_SIZE; col++) {
            if (board[row][col] === CellState.EMPTY) {
              cells.push({ row: row, col: col });
            }
          }
        }
        return cells;
      }

      /**
       * ランダムな進行中（IN_PROGRESS）GameState を生成する。
       *
       * createGame() から始め、最大 maxMoves 手までランダムな有効着手を適用する。
       * 各手はランダムな盤内座標へ placeStone を試み、有効な結果のみ採用する
       * （既石など無効な手はスキップして同じ状態を保つ）。着手の結果ゲームが
       * 終局（勝ち・引き分け）した場合は、その時点で適用を打ち切る。
       *
       * 返り値は基本的に IN_PROGRESS の状態だが、maxMoves 手目で 5 連や満杯が
       * 成立した場合は終局状態（BLACK_WIN / WHITE_WIN / DRAW）になり得る。
       * 進行中の状態が必要な呼び出し側は status を確認すること。
       * 本関数は自身で新しい状態を構築するため、外部の状態は一切変更しない。
       * @param {number} [maxMoves=20] 適用を試みる着手の最大数
       * @returns {{board: string[][], currentTurn: string, status: string}} 生成した GameState
       */
      function randomInProgressState(maxMoves) {
        const limit = Number.isInteger(maxMoves) && maxMoves >= 0 ? maxMoves : 20;
        let state = GoBoardLogic.createGame();
        for (let i = 0; i < limit; i++) {
          if (state.status !== GameStatus.IN_PROGRESS) {
            break; // 終局したら早期に打ち切る
          }
          const row = randomInt(BOARD_SIZE);
          const col = randomInt(BOARD_SIZE);
          const result = GoBoardLogic.placeStone(state, row, col);
          if (result.valid) {
            state = result.state;
          }
          // 無効な手（既石など）は state を維持してスキップする。
        }
        return state;
      }

      /**
       * 盤面からランダムな空の交点を 1 つ選んで返す。空交点が無ければ null を返す。
       * 渡された board は変更しない。
       * @param {string[][]} board 盤面
       * @returns {{row: number, col: number}|null} 空交点の座標、無ければ null
       */
      function randomEmptyCell(board) {
        const empties = collectEmptyCells(board);
        if (empties.length === 0) {
          return null;
        }
        return empties[randomInt(empties.length)];
      }

      /**
       * 行または列の少なくとも一方が 0〜14 の範囲外の整数となる座標を返す。
       * 他方は範囲内の整数になり得る（両方が範囲外になることもある）。
       * いずれの値も整数であり、非整数（小数・null 等）は含まない。
       * @returns {{row: number, col: number}} 範囲外座標
       */
      function randomOutOfBoundsCoord() {
        const outChoices = [-1, -2, -5, -100, BOARD_SIZE, BOARD_SIZE + 1, 20, 100];
        const outOfBoundsInt = function () {
          return outChoices[randomInt(outChoices.length)];
        };
        const which = randomInt(3); // 0:行のみ 1:列のみ 2:両方
        if (which === 0) {
          return { row: outOfBoundsInt(), col: randomInt(BOARD_SIZE) };
        }
        if (which === 1) {
          return { row: randomInt(BOARD_SIZE), col: outOfBoundsInt() };
        }
        return { row: outOfBoundsInt(), col: outOfBoundsInt() };
      }

      /**
       * 行または列の少なくとも一方が整数でない不正な値となる座標を返す。
       * 不正値は小数・null・undefined・NaN・文字列の集合から選ぶ。
       * 他方は範囲内の整数になり得る（両方が不正値になることもある）。
       * @returns {{row: *, col: *}} 不正座標
       */
      function randomInvalidCoord() {
        const invalidChoices = [1.5, 2.7, -0.5, null, undefined, NaN, '3', '0'];
        const invalidValue = function () {
          return invalidChoices[randomInt(invalidChoices.length)];
        };
        const which = randomInt(3); // 0:行のみ 1:列のみ 2:両方
        if (which === 0) {
          return { row: invalidValue(), col: randomInt(BOARD_SIZE) };
        }
        if (which === 1) {
          return { row: randomInt(BOARD_SIZE), col: invalidValue() };
        }
        return { row: invalidValue(), col: invalidValue() };
      }

      /**
       * 任意の色・方向・盤内開始位置から 5 連となる着手構成情報を生成する。
       *
       * DIRECTIONS からランダムに 1 方向を選び、その方向へ 5 交点すべてが盤内に
       * 収まる開始位置を選ぶ。返り値には、5 連を構成する 5 交点の座標列と、
       * 置くべき色・CellState・期待される勝ち Game_Status を含める。
       * 呼び出し側はこの情報を使って 5 つの同色石を配置できる。
       * 本関数は状態を持たず、渡された引数も変更しない。
       * @returns {{
       *   color: string,
       *   cell: string,
       *   win: string,
       *   dir: {dr: number, dc: number},
       *   cells: {row: number, col: number}[]
       * }} 5 連構成情報（cells は開始から方向順の 5 交点）
       */
      function randomFiveSetup() {
        const colorCases = [
          { color: Color.BLACK, cell: CellState.BLACK, win: GameStatus.BLACK_WIN },
          { color: Color.WHITE, cell: CellState.WHITE, win: GameStatus.WHITE_WIN },
        ];
        const cc = colorCases[randomInt(colorCases.length)];
        const dir = DIRECTIONS[randomInt(DIRECTIONS.length)];
        const dr = dir.dr;
        const dc = dir.dc;

        // 5 連（k=0..4 の start + k*dir）がすべて盤内に収まる開始位置を選ぶ。
        // dr は 0 か 1、dc は -1 / 0 / 1（DIRECTIONS の定義に依存）。
        const rowMax = BOARD_SIZE - 1 - 4 * dr; // dr>=0 前提
        const row0 = randomInt(rowMax + 1);
        let col0;
        if (dc === 1) {
          col0 = randomInt(BOARD_SIZE - 4);      // 0 .. BOARD_SIZE-5
        } else if (dc === -1) {
          col0 = 4 + randomInt(BOARD_SIZE - 4);  // 4 .. BOARD_SIZE-1
        } else {
          col0 = randomInt(BOARD_SIZE);          // 0 .. BOARD_SIZE-1
        }

        const cells = [];
        for (let k = 0; k < WIN_LENGTH; k++) {
          cells.push({ row: row0 + k * dr, col: col0 + k * dc });
        }

        return {
          color: cc.color,
          cell: cc.cell,
          win: cc.win,
          dir: { dr: dr, dc: dc },
          cells: cells,
        };
      }

      /* --- local-rules（連続3の同時2箇所成立の禁止）向けジェネレータ --------------------
         Task 7.1 / 7.2。連続3の同時2箇所成立の禁止の意味論は「確定後盤面全体の当該色 Open_Three
         総数」で定義される（着手点を通る方向数ではない）。本節のジェネレータは
         この全盤面個数の意味論に合わせて、次の盤面・着手を確実に構成する。

           - randomBlackDoubleThree: 黒着手で盤面全体の黒 Open_Three が 2 個以上
             （着手点十字で 2 個成立させる形を含む）。
           - randomBlackSingleOpenThree: 黒着手後の盤面全体の黒 Open_Three が
             1 個以下に収まる（受理される手）。
           - randomWhiteDoubleThree: 白着手で盤面全体の白 Open_Three が 2 個以上
             （手番を白に設定）。
           - randomBlackDoubleThreeWin: 黒 Open_Three 2 個以上かつ着手が 5 連にも
             なる（Win_Condition と連続3の2箇所成立が同時成立）。
           - randomBlackDistantDoubleThree: 着手点と無関係な黒 Open_Three を 1 個
             先置きし、今回の黒着手が離れた位置に 2 個目の黒 Open_Three を成立させる
             （互いに交わらない全盤面 2 個。Task 7.2）。
           - randomBlackDistantAccept: 上と同じ「離れた既存 Open_Three が 1 個ある」
             盤面で、黒着手後も盤面全体の黒 Open_Three を 1 個以下に保つ受理ケース
             （Task 7.2）。

         いずれも DOM 非依存で、渡された状態を変更せず新しい fixture を返す。
         Open_Three は「同色ちょうど 3 個連続かつ少なくとも一方の端が空で延長可能」
         という findOpenThrees のセマンティクスに合わせて構成し、生成した fixture が
         意図した個数条件を満たすことを GoBoardLogic の公開関数（computeThreeRegistry /
         isDoubleThree / checkWin）で検証（構成が外れた場合は上限付きで再生成）して
         から返す。design.md「追加が必要なジェネレータの設計要点」に対応する。 */

      /**
       * 空の 15×15 盤面（全交点 CellState.EMPTY）を新規生成する内部ヘルパ。
       * @returns {string[][]} 空盤面
       */
      function createEmptyBoard() {
        const board = [];
        for (let row = 0; row < BOARD_SIZE; row++) {
          const cells = [];
          for (let col = 0; col < BOARD_SIZE; col++) {
            cells.push(CellState.EMPTY);
          }
          board.push(cells);
        }
        return board;
      }

      /**
       * 盤面を行ごとに複製する内部ヘルパ（渡された board は変更しない）。
       * @param {string[][]} board 複製元の盤面
       * @returns {string[][]} 複製された盤面
       */
      function cloneBoard(board) {
        return board.map(function (cells) {
          return cells.slice();
        });
      }

      /**
       * 指定盤面へ「着手」を反映した複製盤面を返す内部ヘルパ。
       * 元の board は変更しない。
       * @param {string[][]} board 元盤面
       * @param {number} row 着手行
       * @param {number} col 着手列
       * @param {string} cell 置く CellState（BLACK / WHITE）
       * @returns {string[][]} 着手を反映した複製盤面
       */
      function boardWithStone(board, row, col, cell) {
        const copy = cloneBoard(board);
        copy[row][col] = cell;
        return copy;
      }

      /**
       * 中心交点 (cr, cc) を含む連続 3（contiguous-3）を 1 方向ぶん、着手前盤面へ
       * 先置きするための「両隣の座標」を返す内部ヘルパ。
       *
       * 中心交点そのものは着手（target move）で埋めるため、ここでは中心の
       * 前後 1 マス（center-1・center+1）だけを同色石として先置きする対象とする。
       * これにより target を置いた時点で center を中央とする `X X X` が成立し、
       * 両端（center-2・center+2）は空のままとなり Open_Three 条件を満たす。
       * @param {number} cr 中心行
       * @param {number} cc 中心列
       * @param {{dr:number, dc:number}} dir 方向
       * @returns {{row:number, col:number}[]} 先置きする 2 交点（center±1）
       */
      function neighborStonesFor(cr, cc, dir) {
        return [
          { row: cr - dir.dr, col: cc - dir.dc },
          { row: cr + dir.dr, col: cc + dir.dc },
        ];
      }

      /**
       * 黒/白の Double_Three（着手後の盤面全体に当該色 Open_Three が 2 個以上
       * 成立する着手）を確実に構成する fixture を生成する内部ヘルパ。
       *
       * 着手点を中心とする十字（相異なる 2 方向）に連続 3 を作り、着手後の盤面
       * 全体で当該色 Open_Three がちょうど 2 個成立する形を用いる。判定は
       * 着手点を通る方向数ではなく盤面全体の個数で行うため、十字で 2 個成立させれば
       * isDoubleThree(post, color) が true となる。
       *
       * 手順:
       *   1. 盤端から十分な余白（±2 の窓が盤内に収まる）を持つ中心交点を選ぶ。
       *   2. DIRECTIONS から相異なる 2 方向を選び、各方向について中心の両隣
       *      （center±1）へ同色石を先置きする（中心自身は target move で埋める）。
       *   3. target を置いた盤面を作り、盤面全体の当該色 Open_Three が 2 個以上
       *      （isDoubleThree が true）であること、かつ 5 連（checkWin）が成立して
       *      いないことを検証する。満たさない場合は上限まで再生成する。
       *
       * @param {string} color 着手色（Color.BLACK / Color.WHITE）
       * @returns {{
       *   board: string[][],
       *   move: {row:number, col:number},
       *   currentTurn: string,
       *   color: string
       * }} 着手前盤面・target move・手番・色を含む fixture
       */
      function buildDoubleThreeFixture(color) {
        const cell = color === Color.BLACK ? CellState.BLACK : CellState.WHITE;
        const MAX_ATTEMPTS = 200;
        for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
          // 中心を 4〜10 に取り、いずれの方向でも center±2 が盤内に収まるようにする。
          const cr = 4 + randomInt(7); // 4 .. 10
          const cc = 4 + randomInt(7); // 4 .. 10

          // 相異なる 2 方向を選ぶ。
          const d1 = randomInt(DIRECTIONS.length);
          let d2 = randomInt(DIRECTIONS.length);
          while (d2 === d1) {
            d2 = randomInt(DIRECTIONS.length);
          }
          const dirs = [DIRECTIONS[d1], DIRECTIONS[d2]];

          const board = createEmptyBoard();
          for (let i = 0; i < dirs.length; i++) {
            const neighbors = neighborStonesFor(cr, cc, dirs[i]);
            for (let j = 0; j < neighbors.length; j++) {
              board[neighbors[j].row][neighbors[j].col] = cell;
            }
          }

          // target を置いた盤面で条件を検証する。判定は盤面全体の個数で行う。
          const post = boardWithStone(board, cr, cc, cell);
          if (
            GoBoardLogic.isDoubleThree(post, color) &&
            !GoBoardLogic.checkWin(post, cr, cc)
          ) {
            return {
              board: board,
              move: { row: cr, col: cc },
              currentTurn: color,
              color: color,
            };
          }
        }
        // 上限まで構成できない場合は最後の attempt 相当を返さず、決定的な
        // フォールバック（縦横 2 方向・中心 (7,7)）を構築して返す。
        const board = createEmptyBoard();
        const fallbackDirs = [
          { dr: 0, dc: 1 }, // 横
          { dr: 1, dc: 0 }, // 縦
        ];
        for (let i = 0; i < fallbackDirs.length; i++) {
          const neighbors = neighborStonesFor(7, 7, fallbackDirs[i]);
          for (let j = 0; j < neighbors.length; j++) {
            board[neighbors[j].row][neighbors[j].col] = cell;
          }
        }
        return {
          board: board,
          move: { row: 7, col: 7 },
          currentTurn: color,
          color: color,
        };
      }

      /**
       * 黒の Double_Three を確実に構成する fixture を生成する。
       *
       * 着手前盤面 board へ target move (move.row, move.col) として黒石を置くと、
       * 相異なる 2 方向以上で Open_Three が成立する（Double_Three となる）。
       * かつ、その着手は 5 連（Win_Condition）を成立させない。currentTurn は
       * Color.BLACK。プロパティテストは board から GameState を構築し
       * GoBoardLogic.applyMove(state, move.row, move.col) を呼んで、着手が
       * DOUBLE_THREE で拒否されることを検証できる。
       * @returns {{
       *   board: string[][],
       *   move: {row:number, col:number},
       *   currentTurn: string,
       *   color: string
       * }} 黒の Double_Three fixture
       */
      function randomBlackDoubleThree() {
        return buildDoubleThreeFixture(Color.BLACK);
      }

      /**
       * 白の Double_Three を構成する fixture を生成する（手番を白に設定）。
       *
       * randomBlackDoubleThree と同一の構成だが color/currentTurn が Color.WHITE。
       * プロパティテストは、白の着手には連続3の同時2箇所成立の禁止が適用されず applyMove が
       * valid=true で受理することを検証できる。
       * @returns {{
       *   board: string[][],
       *   move: {row:number, col:number},
       *   currentTurn: string,
       *   color: string
       * }} 白の Double_Three fixture（currentTurn=WHITE）
       */
      function randomWhiteDoubleThree() {
        return buildDoubleThreeFixture(Color.WHITE);
      }

      /**
       * 黒着手後の盤面全体の黒 Open_Three が 1 個以下に収まる（受理される）
       * fixture を生成する。
       *
       * target move として黒石を置くと、盤面全体の黒 Open_Three が 1 個以下
       * （通常はちょうど 1 個）となり、かつ 5 連も成立しない。currentTurn は
       * Color.BLACK。他方向・他所に誤って 2 個目の Open_Three ができないよう、
       * 空盤の単一方向にのみ両隣を先置きし、生成後に盤面全体の黒 Open_Three 個数が
       * 1 個以下（computeThreeRegistry(post).black.length <= 1）であることを
       * 検証する（外れた場合は上限まで再生成）。判定は方向数ではなく盤面全体の
       * 個数で行う。
       * @returns {{
       *   board: string[][],
       *   move: {row:number, col:number},
       *   currentTurn: string,
       *   color: string
       * }} 黒の受理（Open_Three 1 個以下）fixture
       */
      function randomBlackSingleOpenThree() {
        const cell = CellState.BLACK;
        const MAX_ATTEMPTS = 200;
        for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
          const cr = 4 + randomInt(7); // 4 .. 10
          const cc = 4 + randomInt(7); // 4 .. 10
          const dir = DIRECTIONS[randomInt(DIRECTIONS.length)];

          const board = createEmptyBoard();
          const neighbors = neighborStonesFor(cr, cc, dir);
          for (let j = 0; j < neighbors.length; j++) {
            board[neighbors[j].row][neighbors[j].col] = cell;
          }

          const post = boardWithStone(board, cr, cc, cell);
          const blackCount = GoBoardLogic.computeThreeRegistry(post).black.length;
          if (blackCount <= 1 && !GoBoardLogic.checkWin(post, cr, cc)) {
            return {
              board: board,
              move: { row: cr, col: cc },
              currentTurn: Color.BLACK,
              color: Color.BLACK,
            };
          }
        }
        // フォールバック: 中心 (7,7) を横方向に単一 Open_Three とする。
        // 盤面全体の黒 Open_Three は 1 個。
        const board = createEmptyBoard();
        const neighbors = neighborStonesFor(7, 7, { dr: 0, dc: 1 });
        for (let j = 0; j < neighbors.length; j++) {
          board[neighbors[j].row][neighbors[j].col] = cell;
        }
        return {
          board: board,
          move: { row: 7, col: 7 },
          currentTurn: Color.BLACK,
          color: Color.BLACK,
        };
      }

      /**
       * 黒の Double_Three かつ 5 連（Win_Condition と連続3の2箇所成立が同時成立）となる
       * fixture を生成する。
       *
       * target move として黒石を置くと、ある 1 方向では同色 5 連（Win_Condition）を
       * 成立させ、別の 1 方向では Open_Three を成立させる。これにより
       * 盤面全体の黒 Open_Three が 2 個以上（isDoubleThree が true）となりつつ
       * checkWin も true になり、applyMove が連続3の同時2箇所成立の禁止より Win_Condition を優先して
       * BLACK_WIN とすることを検証できる。currentTurn は Color.BLACK。
       *
       * 構成:
       *   1. 中心 (cr, cc) を余白十分な範囲で選ぶ。
       *   2. 勝ち方向 winDir を選び、その方向へ target を含む 5 連を作るための
       *      残り 4 石（中心から±方向へ連続）を先置きする。
       *   3. winDir と相異なる方向 otherDir を選び、その方向の中心両隣へ黒石を
      *      先置きして Open_Three を作る。
       *   4. target を置いた盤面で checkWin かつ isDoubleThree（盤面全体の黒
       *      Open_Three が 2 個以上）が true となることを検証する（外れた場合は
       *      上限まで再生成）。
       * @returns {{
       *   board: string[][],
       *   move: {row:number, col:number},
       *   currentTurn: string,
       *   color: string
       * }} 黒の Double_Three かつ Win_Condition fixture
       */
      function randomBlackDoubleThreeWin() {
        const cell = CellState.BLACK;
        const MAX_ATTEMPTS = 300;
        for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
          // 5 連方向は中心から -offset..+offset まで最大 5 連が盤内に必要。
          // 中心を 6〜8 に取り、中心±4 が盤内（2..12）に収まるようにする。
          const cr = 6 + randomInt(3); // 6 .. 8
          const cc = 6 + randomInt(3); // 6 .. 8

          const dwin = randomInt(DIRECTIONS.length);
          let dother = randomInt(DIRECTIONS.length);
          while (dother === dwin) {
            dother = randomInt(DIRECTIONS.length);
          }
          const winDir = DIRECTIONS[dwin];
          const otherDir = DIRECTIONS[dother];

          const board = createEmptyBoard();

          // 勝ち方向: 中心を含む連続 5 連のうち、中心以外の 4 石を先置きする。
          // 中心を start+offset の位置に置くよう offset をランダムに選び、
          // 5 連 [offsetK - offset .. offsetK - offset + 4] が盤内に収まるものとする。
          const winOffset = randomInt(WIN_LENGTH); // 0..4: 5 連中の中心の位置
          let winPlaceable = true;
          for (let k = 0; k < WIN_LENGTH; k++) {
            const rel = k - winOffset; // 中心からの相対位置
            if (rel === 0) {
              continue; // 中心は target move で埋める
            }
            const r = cr + rel * winDir.dr;
            const c = cc + rel * winDir.dc;
            if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) {
              winPlaceable = false;
              break;
            }
            board[r][c] = cell;
          }
          if (!winPlaceable) {
            continue;
          }

          // もう 1 方向: 中心両隣へ黒石を先置きして Open_Three を作る。
          const neighbors = neighborStonesFor(cr, cc, otherDir);
          let otherPlaceable = true;
          for (let j = 0; j < neighbors.length; j++) {
            const p = neighbors[j];
            if (p.row < 0 || p.row >= BOARD_SIZE || p.col < 0 || p.col >= BOARD_SIZE) {
              otherPlaceable = false;
              break;
            }
            board[p.row][p.col] = cell;
          }
          if (!otherPlaceable) {
            continue;
          }

          const post = boardWithStone(board, cr, cc, cell);
          if (
            GoBoardLogic.checkWin(post, cr, cc) &&
            GoBoardLogic.isDoubleThree(post, Color.BLACK)
          ) {
            return {
              board: board,
              move: { row: cr, col: cc },
              currentTurn: Color.BLACK,
              color: Color.BLACK,
            };
          }
        }
        // フォールバック: 中心 (7,7)。横方向に 5 連（(7,3)..(7,7)、target=(7,7)）、
        // 縦方向に Open_Three（(6,7),(8,7)）を作る。
        const board = createEmptyBoard();
        board[7][3] = cell;
        board[7][4] = cell;
        board[7][5] = cell;
        board[7][6] = cell;
        board[6][7] = cell;
        board[8][7] = cell;
        return {
          board: board,
          move: { row: 7, col: 7 },
          currentTurn: Color.BLACK,
          color: Color.BLACK,
        };
      }

      /* --- Task 7.2: 「既存 Open_Three ＋ 離れた 2 個目」ジェネレータ -----
         連続3の同時2箇所成立の禁止の意味論は盤面全体の当該色 Open_Three 総数で定義されるため、
         着手点と交わらない離れた既存 Open_Three が別途成立していても、今回の
         着手が 2 個目を作れば Double_Three として拒否される（要件 1.5）。
         これを明示的に構成するため、盤面を上下 2 領域に分け、上領域へ着手点と
         無関係な黒 Open_Three を 1 個先置きし、下領域で今回の黒着手が 2 個目の
         黒 Open_Three を成立させる。2 個は行番号で十分離れており、共通交点を
         持たない。あわせて、同じ「離れた既存 1 個」を保ちつつ着手後も盤面全体の
         黒 Open_Three を 1 個以下に留める受理ケースも用意する。 */

      /**
       * 指定行 row の (col, col+1, col+2) へ黒石を横 3 連として先置きした結果を、
       * 渡された board（変更しない）の複製に反映して返す内部ヘルパ。両端外側
       * (col-1) と (col+3) は空のまま残すため、単独で 1 個の黒 Open_Three となる。
       * row は 0..14、col は 1..(BOARD_SIZE-4) を想定し、両端外側が盤内に収まる。
       * @param {string[][]} board 元盤面
       * @param {number} row 行
       * @param {number} col 3 連の左端列
       * @returns {string[][]} 横 3 連を先置きした複製盤面
       */
      function withHorizontalThree(board, row, col) {
        const copy = cloneBoard(board);
        copy[row][col] = CellState.BLACK;
        copy[row][col + 1] = CellState.BLACK;
        copy[row][col + 2] = CellState.BLACK;
        return copy;
      }

      /**
       * 着手点と無関係な黒 Open_Three を 1 個先置きし、今回の黒着手が離れた位置に
       * 2 個目の黒 Open_Three を成立させる fixture を生成する（Task 7.2）。
       *
       * 上領域（行 1〜2）へ既存の横 3 連 Open_Three を 1 個先置きする。下領域
       * （行 11〜13）で、着手点の横両隣（col±1）を黒で先置きし、target move で
       * 中央を埋めると 2 個目の黒 Open_Three が成立する。2 個は行が大きく離れて
       * おり共通交点を持たない。着手前盤面の黒 Open_Three が 1 個、着手後が 2 個
       * かつ非 Win_Condition であることを検証する（外れた場合は上限まで再生成）。
       * currentTurn は Color.BLACK。
       * @returns {{
       *   board: string[][],
       *   move: {row:number, col:number},
       *   currentTurn: string,
       *   color: string
       * }} 既存 1 個＋離れた 2 個目を作る黒 Double_Three fixture
       */
      function randomBlackDistantDoubleThree() {
        const cell = CellState.BLACK;
        const MAX_ATTEMPTS = 200;
        for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
          // 既存 Open_Three（上領域・行 1〜2）。左端列は 1..(BOARD_SIZE-4)。
          const existRow = 1 + randomInt(2); // 1 .. 2
          const existCol = 1 + randomInt(BOARD_SIZE - 4); // 1 .. 11

          // 着手で作る 2 個目（下領域・行 11〜13）。中央列 mc の両隣を先置きする。
          const moveRow = 11 + randomInt(3); // 11 .. 13
          const mc = 2 + randomInt(BOARD_SIZE - 4); // 2 .. 12（両隣が盤内）

          // 既存 Open_Three を先置きした盤面。
          const board = withHorizontalThree(createEmptyBoard(), existRow, existCol);
          // 着手点の横両隣（中央は target move で埋める）。
          board[moveRow][mc - 1] = cell;
          board[moveRow][mc + 1] = cell;

          // 着手前は黒 Open_Three が 1 個であることを確認する。
          const preCount = GoBoardLogic.computeThreeRegistry(board).black.length;
          if (preCount !== 1) {
            continue;
          }

          // target を置いた盤面で全盤面 2 個かつ非 Win_Condition を検証する。
          const post = boardWithStone(board, moveRow, mc, cell);
          const postCount = GoBoardLogic.computeThreeRegistry(post).black.length;
          if (postCount === 2 && !GoBoardLogic.checkWin(post, moveRow, mc)) {
            return {
              board: board,
              move: { row: moveRow, col: mc },
              currentTurn: Color.BLACK,
              color: Color.BLACK,
            };
          }
        }
        // フォールバック: 既存 (1,1)(1,2)(1,3)、着手 (13,7) で (13,6)(13,7)(13,8)。
        const board = withHorizontalThree(createEmptyBoard(), 1, 1);
        board[13][6] = cell;
        board[13][8] = cell;
        return {
          board: board,
          move: { row: 13, col: 7 },
          currentTurn: Color.BLACK,
          color: Color.BLACK,
        };
      }

      /**
       * 着手点と無関係な黒 Open_Three を 1 個先置きしつつ、今回の黒着手後も盤面
       * 全体の黒 Open_Three を 1 個以下に保つ（受理される）fixture を生成する
       * （Task 7.2）。
       *
       * 上領域（行 1〜2）へ既存の横 3 連 Open_Three を 1 個先置きする。下領域
       * （行 11〜13）で、既存 Open_Three と交わらない孤立した空交点へ黒石を置く。
       * 単独の 1 手は新たな Open_Three を作らないため、着手後も盤面全体の黒
       * Open_Three は 1 個のままとなり applyMove に受理される。着手前・着手後
       * ともに黒 Open_Three が 1 個であること、非 Win_Condition であることを検証
       * する。currentTurn は Color.BLACK。
       * @returns {{
       *   board: string[][],
       *   move: {row:number, col:number},
       *   currentTurn: string,
       *   color: string
       * }} 既存 1 個を保ったまま受理される黒着手 fixture
       */
      function randomBlackDistantAccept() {
        const cell = CellState.BLACK;
        const MAX_ATTEMPTS = 200;
        for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
          const existRow = 1 + randomInt(2); // 1 .. 2
          const existCol = 1 + randomInt(BOARD_SIZE - 4); // 1 .. 11

          // 既存 Open_Three を先置きした盤面。
          const board = withHorizontalThree(createEmptyBoard(), existRow, existCol);

          // 下領域の孤立した空交点へ 1 手だけ置く（周囲に黒石を作らない）。
          const moveRow = 11 + randomInt(3); // 11 .. 13
          const mc = 2 + randomInt(BOARD_SIZE - 4); // 2 .. 12

          // 着手前は黒 Open_Three が 1 個であることを確認する。
          const preCount = GoBoardLogic.computeThreeRegistry(board).black.length;
          if (preCount !== 1) {
            continue;
          }

          // target を置いた盤面で全盤面 1 個以下かつ非 Win_Condition を検証する。
          const post = boardWithStone(board, moveRow, mc, cell);
          const postCount = GoBoardLogic.computeThreeRegistry(post).black.length;
          if (postCount <= 1 && !GoBoardLogic.checkWin(post, moveRow, mc)) {
            return {
              board: board,
              move: { row: moveRow, col: mc },
              currentTurn: Color.BLACK,
              color: Color.BLACK,
            };
          }
        }
        // フォールバック: 既存 (1,1)(1,2)(1,3)、孤立着手 (13,7)。
        const board = withHorizontalThree(createEmptyBoard(), 1, 1);
        return {
          board: board,
          move: { row: 13, col: 7 },
          currentTurn: Color.BLACK,
          color: Color.BLACK,
        };
      }

      return {
        randomInt: randomInt,
        randomInProgressState: randomInProgressState,
        randomEmptyCell: randomEmptyCell,
        randomOutOfBoundsCoord: randomOutOfBoundsCoord,
        randomInvalidCoord: randomInvalidCoord,
        randomFiveSetup: randomFiveSetup,
        randomBlackDoubleThree: randomBlackDoubleThree,
        randomWhiteDoubleThree: randomWhiteDoubleThree,
        randomBlackSingleOpenThree: randomBlackSingleOpenThree,
        randomBlackDoubleThreeWin: randomBlackDoubleThreeWin,
        randomBlackDistantDoubleThree: randomBlackDistantDoubleThree,
        randomBlackDistantAccept: randomBlackDistantAccept,
      };
    })();

    /* --- プロパティテスト -------------------------------------------- */

    // Feature: goboard, Property 8: 新しいゲームの生成は既存状態に依存しない
    // 任意の着手列を適用した後の GameState が存在しても、createGame() は常に
    // 全 225 交点が空・Current_Turn が黒・Game_Status が進行中である
    // 同一の初期状態を返す（かつ毎回別インスタンス）。
    // Validates: Requirements 1.5
    test('Property 8: createGame は既存状態に依存せず初期状態を返す', function () {
      // このテスト専用の局所ランダムヘルパ。
      // Task 5.2 の専用ジェネレータが後で置き換え/共存できるよう、
      // ここに閉じた形で最小限に定義する。
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };

      // createGame() から N 手の有効着手をランダムに適用し、
      // 進行中っぽい状態を作る。無効・終局結果はスキップする。
      const buildRandomState = function (moveCount) {
        let state = GoBoardLogic.createGame();
        for (let i = 0; i < moveCount; i++) {
          if (state.status !== GameStatus.IN_PROGRESS) {
            break;
          }
          const row = randomInt(BOARD_SIZE);
          const col = randomInt(BOARD_SIZE);
          const result = GoBoardLogic.placeStone(state, row, col);
          if (result.valid) {
            state = result.state;
          }
          // 無効（既石など）ならその手はスキップし、同じ state を維持する。
        }
        return state;
      };

      const ITERATIONS = 100;
      for (let iter = 0; iter < ITERATIONS; iter++) {
        // 0〜19 手のランダムな事前状態を構築する。
        const prior = buildRandomState(randomInt(20));

        // 事前状態の有無にかかわらず、createGame() は常に同一の初期状態を返す。
        const fresh = GoBoardLogic.createGame();

        // 全 225 交点が空であること。
        assertEqual(fresh.board.length, BOARD_SIZE, 'board 行数');
        for (let row = 0; row < BOARD_SIZE; row++) {
          assertEqual(fresh.board[row].length, BOARD_SIZE, 'board 列数');
          for (let col = 0; col < BOARD_SIZE; col++) {
            assertEqual(
              fresh.board[row][col],
              CellState.EMPTY,
              '交点(' + row + ',' + col + ') が空'
            );
          }
        }

        // Current_Turn が黒、Game_Status が進行中であること。
        assertEqual(fresh.currentTurn, Color.BLACK, 'currentTurn');
        assertEqual(fresh.status, GameStatus.IN_PROGRESS, 'status');

        // 事前状態とは別インスタンスの、真新しいオブジェクトであること。
        if (fresh === prior) {
          throw new Error('createGame() が事前状態と同一インスタンスを返した');
        }
        if (fresh.board === prior.board) {
          throw new Error('createGame() が事前状態と同一の board を返した');
        }
      }
    });

    // Feature: goboard, Property 4: いずれかの方向に 5 連が揃うと対応する色の勝ちになる
    // 任意の色（黒・白）・任意の方向（縦・横・右上がり斜め・右下がり斜め）・
    // 盤内に収まる任意の開始位置について、その方向へ同じ色の石が 5 つ連続する
    // 着手列を適用すると、最後の着手の後に Game_Status がその色の勝ち
    // （黒なら BLACK_WIN、白なら WHITE_WIN）になる。
    //
    // placeStone は手番を自動で交互に切り替えるため、同色 5 連を placeStone のみで
    // 直接作ることはできない。そこで、5 連を構成する 5 交点のうち 4 交点に該当色を
    // 直接（CellState を設定して）先置きし、currentTurn を該当色・status を IN_PROGRESS
    // とした GameState を組み立て、残る 1 交点（ランダムに選んだ「最後の着手」）に対して
    // GoBoardLogic.placeStone を呼び出して勝敗判定経路を検証する。
    // Validates: Requirements 4.1, 4.2, 4.3, 4.4
    test('Property 4: いずれかの方向に 5 連が揃うと対応する色の勝ちになる', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };

      // 検証対象の色・CellState・期待する勝ち Game_Status の組。
      const colorCases = [
        { color: Color.BLACK, cell: CellState.BLACK, win: GameStatus.BLACK_WIN },
        { color: Color.WHITE, cell: CellState.WHITE, win: GameStatus.WHITE_WIN },
      ];

      const ITERATIONS = 120; // 最低 100 回のランダム反復
      for (let iter = 0; iter < ITERATIONS; iter++) {
        // 1. 色と方向をランダムに選ぶ。
        const cc = colorCases[randomInt(colorCases.length)];
        const dir = DIRECTIONS[randomInt(DIRECTIONS.length)];
        const dr = dir.dr;
        const dc = dir.dc;

        // 2. 5 連（k=0..4 の start + k*dir）がすべて盤内に収まる開始位置を選ぶ。
        //    行方向: 0 <= r0 + 4*dr <= BOARD_SIZE-1（dr は 0 か 1）。
        //    列方向: dc により取りうる範囲が変わる（dc は -1 / 0 / 1）。
        //      dc =  1 → 0 <= c0, c0 + 4 <= BOARD_SIZE-1
        //      dc =  0 → 0 <= c0 <= BOARD_SIZE-1
        //      dc = -1 → 0 <= c0 - 4, c0 <= BOARD_SIZE-1
        const rowMax = BOARD_SIZE - 1 - 4 * dr; // dr>=0 前提
        const row0 = randomInt(rowMax + 1);
        let col0;
        if (dc === 1) {
          col0 = randomInt(BOARD_SIZE - 4); // 0 .. BOARD_SIZE-5
        } else if (dc === -1) {
          col0 = 4 + randomInt(BOARD_SIZE - 4); // 4 .. BOARD_SIZE-1
        } else {
          col0 = randomInt(BOARD_SIZE); // 0 .. BOARD_SIZE-1
        }

        // 3. 5 連を構成する 5 交点を算出する。
        const cells = [];
        for (let k = 0; k < WIN_LENGTH; k++) {
          cells.push({ r: row0 + k * dr, c: col0 + k * dc });
        }

        // 4. どの交点を「最後の着手」にするかをランダムに選ぶ（残り 4 交点を先置き）。
        const finalIndex = randomInt(WIN_LENGTH);

        // 5. 新しい盤を作り、最後の着手以外の 4 交点へ該当色を直接置く。
        const state = GoBoardLogic.createGame();
        for (let k = 0; k < WIN_LENGTH; k++) {
          if (k === finalIndex) {
            continue;
          }
          state.board[cells[k].r][cells[k].c] = cc.cell;
        }
        // 手番を該当色にして、最後の 1 手をその色で着手できるようにする。
        state.currentTurn = cc.color;
        state.status = GameStatus.IN_PROGRESS;

        // 6. 最後の交点へ着手する。
        const fr = cells[finalIndex].r;
        const fc = cells[finalIndex].c;
        const result = GoBoardLogic.placeStone(state, fr, fc);

        const ctx = '色=' + cc.color + ' 方向={dr:' + dr + ',dc:' + dc + '}' +
          ' start=(' + row0 + ',' + col0 + ') finalIndex=' + finalIndex +
          ' final=(' + fr + ',' + fc + ')';

        // 着手は有効で、Game_Status は該当色の勝ちになる。
        assertEqual(result.valid, true, '着手が有効 [' + ctx + ']');
        assertEqual(result.state.status, cc.win, '勝ち Game_Status [' + ctx + ']');
      }
    });

    // Feature: goboard, Property 5: 複数方向で同時に 5 連が成立しても勝ちは単一の結果になる
    // 任意の色について、その色の石が複数の方向で同時に 5 連を成立させる着手をしたとき、
    // Game_Status はその色の勝ち 1 つ（黒なら BLACK_WIN、白なら WHITE_WIN）に設定され、

    //
    // 検証構成: 盤内に安全に収まる中心交点 (r,c) を選び（r・c を 4〜10 に取れば
    // 縦・横・両斜めのいずれでも中心±2 のオフセットが盤内に収まる）、DIRECTIONS から
    // 相異なる 2 方向を選ぶ。各方向について中心を含む 5 連の残り 4 交点（オフセット
    // -2,-1,+1,+2）に該当色を先置きし、currentTurn を該当色・status を IN_PROGRESS と

    // Validates: Requirements 4.5
    test('Property 5: 複数方向で同時に 5 連が成立しても勝ちは単一の結果になる', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };

      const colorCases = [
        { color: Color.BLACK, cell: CellState.BLACK, win: GameStatus.BLACK_WIN },
        { color: Color.WHITE, cell: CellState.WHITE, win: GameStatus.WHITE_WIN },
      ];

      const ITERATIONS = 120; // 最低 100 回のランダム反復
      for (let iter = 0; iter < ITERATIONS; iter++) {
        // 1. 色をランダムに選ぶ。
        const cc = colorCases[randomInt(colorCases.length)];

        // 2. 中心交点を 4〜10 の安全な範囲で選ぶ。
        //    中心±2 のオフセットが縦・横・両斜めのいずれでも盤内に収まる。
        const cr = 4 + randomInt(7); // 4 .. 10
        const ccol = 4 + randomInt(7); // 4 .. 10

        // 3. 相異なる 2 方向をランダムに選ぶ。
        const d1 = randomInt(DIRECTIONS.length);
        let d2 = randomInt(DIRECTIONS.length);
        while (d2 === d1) {
          d2 = randomInt(DIRECTIONS.length);
        }
        const dirs = [DIRECTIONS[d1], DIRECTIONS[d2]];

        // 4. 盤面を作り、中心を含む 5 連の残り 4 交点（オフセット -2,-1,+1,+2）に
        //    2 方向とも該当色を先置きする。中心 (cr,ccol) は最後の着手として空のまま残す。
        const state = GoBoardLogic.createGame();
        for (let i = 0; i < dirs.length; i++) {
          const dr = dirs[i].dr;
          const dc = dirs[i].dc;
          for (let k = -2; k <= 2; k++) {
            if (k === 0) {
              continue; // 中心は placeStone で置く
            }
            state.board[cr + k * dr][ccol + k * dc] = cc.cell;
          }
        }
        state.currentTurn = cc.color;
        state.status = GameStatus.IN_PROGRESS;

        // 5. 中心へ着手する。2 方向で同時に 5 連が成立する。
        const result = GoBoardLogic.placeStone(state, cr, ccol);

        const ctx = '色=' + cc.color + ' 中心=(' + cr + ',' + ccol + ')' +
          ' 方向1={dr:' + dirs[0].dr + ',dc:' + dirs[0].dc + '}' +
          ' 方向2={dr:' + dirs[1].dr + ',dc:' + dirs[1].dc + '}';

        // 着手は有効で、Game_Status は該当色の単一の勝ちになる。
        assertEqual(result.valid, true, '着手が有効 [' + ctx + ']');
        assertEqual(result.state.status, cc.win, '単一の勝ち Game_Status [' + ctx + ']');

        // 結果は BLACK_WIN / WHITE_WIN のいずれか単一で、DRAW や他方の勝ちと矛盾しない。
        const isSingleWin =
          result.state.status === GameStatus.BLACK_WIN ||
          result.state.status === GameStatus.WHITE_WIN;
        assertEqual(isSingleWin, true, '結果が単一の勝ち値 [' + ctx + ']');
      }
    });

    // Feature: goboard, Property 1: 有効着手は手番の色の石を配置する
    // 任意の進行中 GameState と、その盤面の任意の空の交点について、その交点へ

    // ランダムに空の交点を 1 つ選び、着手直前の currentTurn を記録してから

    // Validates: Requirements 2.1, 3.5
    test('Property 1: 有効着手は手番の色の石を配置する', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };

      // createGame() から moveCount 手の有効着手をランダムに適用し、
      // 進行中の状態を作る。無効（既石など）・終局結果はスキップする。
      const buildRandomState = function (moveCount) {
        let state = GoBoardLogic.createGame();
        for (let i = 0; i < moveCount; i++) {
          if (state.status !== GameStatus.IN_PROGRESS) {

        }
        return state;
      };

      // 盤面上の空交点をすべて集める。
      const collectEmptyCells = function (board) {
        const cells = [];
        for (let row = 0; row < BOARD_SIZE; row++) {
          for (let col = 0; col < BOARD_SIZE; col++) {
            if (board[row][col] === CellState.EMPTY) {
              cells.push({ r: row, c: col });
            }
          }
        }
        return cells;
      };

      const ITERATIONS = 120; // 最低 100 回のランダム反復
      let checked = 0;
      let attempts = 0;
      const maxAttempts = ITERATIONS * 10; // 生成失敗による無限ループ防止
      while (checked < ITERATIONS && attempts < maxAttempts) {
        attempts++;

        // 0〜19 手のランダムな進行中状態を作る。
        const state = buildRandomState(randomInt(20));

        if (state.status !== GameStatus.IN_PROGRESS) {
          continue;

        // 空の交点が無ければスキップして作り直す。
        const empties = collectEmptyCells(state.board);
        if (empties.length === 0) {
          continue;
        }

        // ランダムに空の交点を 1 つ選ぶ。
        const pick = empties[randomInt(empties.length)];
        const r = pick.r;
        const c = pick.c;

        // 着手直前の手番を記録する。
        const beforeTurn = state.currentTurn;
        const expectedCell = beforeTurn === Color.BLACK ? CellState.BLACK : CellState.WHITE;

        // 空交点へ着手する。
        const result = GoBoardLogic.placeStone(state, r, c);

        const ctx = '手番=' + beforeTurn + ' 着手=(' + r + ',' + c + ')';

        // 着手は有効で、当該交点は手番の色になる。
        assertEqual(result.valid, true, '着手が有効 [' + ctx + ']');
        assertEqual(
          result.state.board[r][c],
          expectedCell,
          '交点(' + r + ',' + c + ') が手番の色 [' + ctx + ']'
        );

        checked++;
      }

      // 反復回数が最低ラインに達していることを確認する。
      assertEqual(checked >= 100, true, '最低 100 回の反復を実施 (実施 ' + checked + ' 回)');
    });

    // Feature: goboard, Property 2: 有効かつ非決着の着手は手番を他方へ切り替える

    // 反復は本プロパティの対象外としてアサーションをスキップし、非終局の有効着手が

    // Validates: Requirements 2.4
    test('Property 2: 有効かつ非決着の着手は手番を他方へ切り替える', function () {

      const buildRandomState = function (moveCount) {

      const collectEmptyCells = function (board) {

        for (let row = 0; row < BOARD_SIZE; row++) {

          }
        }

      const ITERATIONS = 120; // 最低 100 回の「非終局の有効着手」を検証する
      let checked = 0;        // 非終局の有効着手として検証した回数
      let attempts = 0;
      const maxAttempts = ITERATIONS * 50; // 生成失敗・終局着手による無限ループ防止
      while (checked < ITERATIONS && attempts < maxAttempts) {
        attempts++;

        // 0〜19 手のランダムな進行中状態を作る。
        const state = buildRandomState(randomInt(20));

        // 進行中でなければこの反復はスキップして作り直す。
        if (state.status !== GameStatus.IN_PROGRESS) {

        // 着手直前の手番を記録する。

      // 非終局の有効着手を最低 100 回検証していることを確認する。
