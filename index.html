    });

    // Feature: goboard, Property 3: 無効な着手は状態を変えず対応する理由を返す
    // 任意の GameState と、以下 4 カテゴリのいずれかに該当する無効な着手について、
    // result.valid === false であり、入力状態の盤面と Current_Turn は着手呼び出しの
    // 前後で変化せず（呼び出し前のスナップショットと深く等しい）、result.reason が
    // カテゴリに対応する理由コードになる。
    //   - 既石（進行中状態で、対象交点に既に石がある）           → OCCUPIED
    //   - 行または列が整数だが 0〜14 の範囲外                     → OUT_OF_BOUNDS
    //   - 行または列が整数でない値（小数・null・undefined・NaN・文字列） → INVALID_COORDINATE
    //   - Game_Status が IN_PROGRESS 以外（BLACK_WIN/WHITE_WIN/DRAW） → NOT_IN_PROGRESS
    //     （この理由が最優先。placeStone は最初に status を検査する）
    //
    // placeStone が入力を破壊しないことも検証する。呼び出し前に入力状態の
    // {board, currentTurn} を JSON 文字列化してスナップショットを取り、呼び出し後に
    // 入力状態が不変であること、および result.state の board / currentTurn が入力と
    // 内容一致であることをアサートする。
    // Validates: Requirements 2.2, 2.3, 3.1, 3.2, 3.3, 3.4, 4.6, 5.3, 5.4, 6.2, 6.3, 6.4
    test('Property 3: 無効な着手は状態を変えず対応する理由を返す', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };

      // createGame() から moveCount 手の有効着手をランダムに適用し、
      // 進行中の状態を作る。無効（既石など）・終局結果はスキップする。
      const buildRandomState = function (moveCount) {
        let state = GoBoardLogic.createGame();
        for (let i = 0; i < moveCount; i++) {
          if (state.status !== GameStatus.IN_PROGRESS) {
            break;
          }
          const row = randomInt(BOARD_SIZE);
          const col = randomInt(BOARD_SIZE);
          const result = GoBoardLogic.placeStone(state, row, col);
          if (result.valid) {
            state = result.state;
          }
          // 無効な手（既石など）は同じ state を保って読み飛ばす。
        }
        return state;
      };

      // 盤面上の既石（EMPTY でない）交点をすべて集める。
      const collectOccupiedCells = function (board) {
        const cells = [];
        for (let row = 0; row < BOARD_SIZE; row++) {
          for (let col = 0; col < BOARD_SIZE; col++) {
            if (board[row][col] !== CellState.EMPTY) {
              cells.push({ r: row, c: col });
            }
          }
        }
        return cells;
      };

      // 少なくとも 1 つ石がある進行中状態を作る。無ければ数手打って石を作る。
      const buildInProgressWithStone = function () {
        let state = buildRandomState(1 + randomInt(19));
        // 進行中でない、または石が 1 つも無ければ、明示的に数手打ち直す。
        let guard = 0;
        while ((state.status !== GameStatus.IN_PROGRESS ||
                collectOccupiedCells(state.board).length === 0) && guard < 50) {
          guard++;
          state = GoBoardLogic.createGame();
          // 中央付近に 1〜3 手、確実に有効な着手を打つ。
          const moves = 1 + randomInt(3);
          for (let m = 0; m < moves; m++) {
            if (state.status !== GameStatus.IN_PROGRESS) {
              break;
            }
            const r = randomInt(BOARD_SIZE);
            const c = randomInt(BOARD_SIZE);
            const res = GoBoardLogic.placeStone(state, r, c);
            if (res.valid) {
              state = res.state;
            }
          }
        }
        return state;
      };

      // 整数だが 0〜14 の範囲外の値を返す。
      const outOfBoundsInt = function () {
        const choices = [-1, -2, -5, 15, 16, 20, 100, -100];
        return choices[randomInt(choices.length)];
      };

      // 整数でない不正な座標値を返す（小数・null・undefined・NaN・文字列）。
      const invalidCoord = function () {
        const choices = [1.5, null, undefined, NaN, '3', 2.7, '0', -0.5];
        return choices[randomInt(choices.length)];
      };

      // 進行中以外の終局 Game_Status。
      const finishedStatuses = [
        GameStatus.BLACK_WIN,
        GameStatus.WHITE_WIN,
        GameStatus.DRAW,
      ];

      const ITERATIONS = 120; // 最低 100 回のランダム反復
      // 各カテゴリが最低 1 回は実行されたことを確認するためのカウンタ。
      const exercised = {
        OCCUPIED: 0,
        OUT_OF_BOUNDS: 0,
        INVALID_COORDINATE: 0,
        NOT_IN_PROGRESS: 0,
      };
      const categories = ['OCCUPIED', 'OUT_OF_BOUNDS', 'INVALID_COORDINATE', 'NOT_IN_PROGRESS'];

      for (let iter = 0; iter < ITERATIONS; iter++) {
        // 全カテゴリを確実に網羅するため、前半はカテゴリを巡回し、
        // 後半はランダムに選ぶ。
        const category = iter < categories.length
          ? categories[iter]
          : categories[randomInt(categories.length)];

        let state;
        let row;
        let col;
        let expectedReason;

        if (category === 'OCCUPIED') {
          // 進行中かつ石が少なくとも 1 つある状態を作り、既石の交点を選ぶ。
          state = buildInProgressWithStone();
          const occupied = collectOccupiedCells(state.board);
          const pick = occupied[randomInt(occupied.length)];
          row = pick.r;
          col = pick.c;
          expectedReason = InvalidReason.OCCUPIED;
        } else if (category === 'OUT_OF_BOUNDS') {
          // 進行中状態で、行または列の少なくとも一方を範囲外の整数にする。
          state = buildRandomState(randomInt(10));
          if (state.status !== GameStatus.IN_PROGRESS) {
            state = GoBoardLogic.createGame();
          }
          // 少なくとも一方を範囲外にする（両方でも可）。
          const which = randomInt(3); // 0:行のみ 1:列のみ 2:両方
          if (which === 0) {
            row = outOfBoundsInt();
            col = randomInt(BOARD_SIZE);
          } else if (which === 1) {
            row = randomInt(BOARD_SIZE);
            col = outOfBoundsInt();
          } else {
            row = outOfBoundsInt();
            col = outOfBoundsInt();
          }
          expectedReason = InvalidReason.OUT_OF_BOUNDS;
        } else if (category === 'INVALID_COORDINATE') {
          // 進行中状態で、行または列の少なくとも一方を非整数の不正値にする。
          state = buildRandomState(randomInt(10));
          if (state.status !== GameStatus.IN_PROGRESS) {
            state = GoBoardLogic.createGame();
          }
          const which = randomInt(3); // 0:行のみ 1:列のみ 2:両方
          if (which === 0) {
            row = invalidCoord();
            col = randomInt(BOARD_SIZE);
          } else if (which === 1) {
            row = randomInt(BOARD_SIZE);
            col = invalidCoord();
          } else {
            row = invalidCoord();
            col = invalidCoord();
          }
          expectedReason = InvalidReason.INVALID_COORDINATE;
        } else {
          // NOT_IN_PROGRESS: 終局状態を作る。status を手動で設定する。
          // 座標は任意（範囲内でも範囲外でもよい）。status 検査が最優先のため
          // NOT_IN_PROGRESS が返る。
          state = GoBoardLogic.createGame();
          state.status = finishedStatuses[randomInt(finishedStatuses.length)];
          row = randomInt(BOARD_SIZE);
          col = randomInt(BOARD_SIZE);
          expectedReason = InvalidReason.NOT_IN_PROGRESS;
        }

        // 呼び出し前に入力状態の {board, currentTurn} をスナップショットする。
        const beforeSnapshot = JSON.stringify({
          board: state.board,
          currentTurn: state.currentTurn,
        });

        const result = GoBoardLogic.placeStone(state, row, col);

        const ctx = 'カテゴリ=' + category +
          ' 着手=(' + String(row) + ',' + String(col) + ')' +
          ' status=' + state.status;

        // 1. 着手は無効。
        assertEqual(result.valid, false, '着手が無効 [' + ctx + ']');

        // 2. 理由はカテゴリに対応する。
        assertEqual(result.reason, expectedReason, '無効理由 [' + ctx + ']');

        // 3. 入力状態の board / currentTurn は呼び出し前後で不変（破壊されない）。
        const afterSnapshot = JSON.stringify({
          board: state.board,
          currentTurn: state.currentTurn,
        });
        assertEqual(afterSnapshot, beforeSnapshot, '入力状態が不変 [' + ctx + ']');

        // 4. result.state の board / currentTurn は入力と内容一致。
        assertEqual(
          JSON.stringify(result.state.board),
          JSON.stringify(state.board),
          'result.state.board が入力と一致 [' + ctx + ']'
        );
        assertEqual(
          result.state.currentTurn,
          state.currentTurn,
          'result.state.currentTurn が入力と一致 [' + ctx + ']'
        );

        exercised[category]++;
      }

      // 4 カテゴリすべてが最低 1 回は実行されたことを確認する。
      assertEqual(exercised.OCCUPIED >= 1, true,
        'OCCUPIED を検証 (実施 ' + exercised.OCCUPIED + ' 回)');
      assertEqual(exercised.OUT_OF_BOUNDS >= 1, true,
        'OUT_OF_BOUNDS を検証 (実施 ' + exercised.OUT_OF_BOUNDS + ' 回)');
      assertEqual(exercised.INVALID_COORDINATE >= 1, true,
        'INVALID_COORDINATE を検証 (実施 ' + exercised.INVALID_COORDINATE + ' 回)');
      assertEqual(exercised.NOT_IN_PROGRESS >= 1, true,
        'NOT_IN_PROGRESS を検証 (実施 ' + exercised.NOT_IN_PROGRESS + ' 回)');
    });

    // Feature: goboard, Property 6: 有効着手は着手した交点以外の既存の石を変更しない
    // 任意の進行中 GameState と、その盤面の任意の空の交点への有効着手について、
    // 着手後の盤面では「着手した交点」を除くすべての交点が着手前の盤面と等しい。
    // すなわち既存の石の色は変わらず、着手交点以外の空の交点も空のまま保たれる。
    // また placeStone は入力状態を破壊しない（呼び出し前後で入力盤面は不変）。
    //
    // 検証構成: createGame() からランダムな有効着手を N 手適用して進行中の
    // GameState を作る（無効・終局結果はスキップ）。生成状態の盤面からランダムに
    // 空の交点 (r,c) を 1 つ選び、着手前の盤面を JSON でスナップショットしてから
    // placeStone を呼ぶ。result.valid が true であることを要求し、着手交点以外の
    // 全交点が着手前と一致すること、着手交点は手番の色になったこと、および入力
    // 盤面が呼び出し前後で不変であることをアサートする。生成状態が進行中でない、
    // または空交点が無い反復はスキップし、最低 100 回の有効着手を検証する。
    // Validates: Requirements 6.1
    test('Property 6: 有効着手は着手した交点以外の既存の石を変更しない', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };

      // createGame() から moveCount 手の有効着手をランダムに適用し、
      // 進行中の状態を作る。無効（既石など）・終局結果はスキップする。
      const buildRandomState = function (moveCount) {
        let state = GoBoardLogic.createGame();
        for (let i = 0; i < moveCount; i++) {
          if (state.status !== GameStatus.IN_PROGRESS) {
            break;
          }
          const row = randomInt(BOARD_SIZE);
          const col = randomInt(BOARD_SIZE);
          const result = GoBoardLogic.placeStone(state, row, col);
          if (result.valid) {
            state = result.state;
          }
          // 無効な手（既石など）は同じ state を保って読み飛ばす。
        }
        return state;
      };

      // 盤面上の空交点をすべて集める。
      const collectEmptyCells = function (board) {
        const cells = [];
        for (let row = 0; row < BOARD_SIZE; row++) {
          for (let col = 0; col < BOARD_SIZE; col++) {
            if (board[row][col] === CellState.EMPTY) {
              cells.push({ r: row, c: col });
            }
          }
        }
        return cells;
      };

      const ITERATIONS = 120; // 最低 100 回のランダム反復
      let checked = 0;
      let attempts = 0;
      const maxAttempts = ITERATIONS * 10; // 生成失敗による無限ループ防止
      while (checked < ITERATIONS && attempts < maxAttempts) {
        attempts++;

        // 0〜19 手のランダムな進行中状態を作る。
        const state = buildRandomState(randomInt(20));

        // 進行中でなければこの反復はスキップして作り直す。
        if (state.status !== GameStatus.IN_PROGRESS) {
          continue;
        }

        // 空の交点が無ければスキップして作り直す。
        const empties = collectEmptyCells(state.board);
        if (empties.length === 0) {
          continue;
        }

        // ランダムに空の交点を 1 つ選ぶ。
        const pick = empties[randomInt(empties.length)];
        const r = pick.r;
        const c = pick.c;

        // 着手前の盤面を深くスナップショットする（各行を複製）。
        const preBoard = state.board.map(function (cells) {
          return cells.slice();
        });
        // 入力破壊検出用に、入力状態の board 全体も JSON でスナップショットする。
        const beforeInputSnapshot = JSON.stringify(state.board);

        // 着手直前の手番を記録する。
        const beforeTurn = state.currentTurn;
        const expectedCell = beforeTurn === Color.BLACK ? CellState.BLACK : CellState.WHITE;

        // 空交点へ着手する。
        const result = GoBoardLogic.placeStone(state, r, c);

        const ctx = '手番=' + beforeTurn + ' 着手=(' + r + ',' + c + ')';

        // 空交点への着手なので有効。
        assertEqual(result.valid, true, '着手が有効 [' + ctx + ']');

        // 着手交点を除く全交点が着手前と等しい（既存の石も空も不変）。
        for (let i = 0; i < BOARD_SIZE; i++) {
          for (let j = 0; j < BOARD_SIZE; j++) {
            if (i === r && j === c) {
              continue; // 着手交点は変化するので対象外
            }
            assertEqual(
              result.state.board[i][j],
              preBoard[i][j],
              '交点(' + i + ',' + j + ') が不変 [' + ctx + ']'
            );
          }
        }

        // 着手交点は手番の色になっている。
        assertEqual(
          result.state.board[r][c],
          expectedCell,
          '着手交点(' + r + ',' + c + ') が手番の色 [' + ctx + ']'
        );

        // 入力状態の盤面は呼び出し前後で不変（placeStone は入力を破壊しない）。
        assertEqual(
          JSON.stringify(state.board),
          beforeInputSnapshot,
          '入力盤面が不変 [' + ctx + ']'
        );

        checked++;
      }

      // 有効着手を最低 100 回検証していることを確認する。
      assertEqual(checked >= 100, true, '最低 100 回の有効着手を検証 (検証 ' + checked + ' 回)');
    });

    // Feature: goboard, Property 7: 盤が満杯で勝者がいなければ引き分けになる
    // 任意の勝者を生じない満杯盤面を構成する着手列について、盤上の全 225 交点が
    // 石で埋まり Win_Condition が成立していない状態に到達したとき、Game_Status は
    // 引き分け（DRAW）に設定される。
    //
    // 検証構成: ランダムな満杯盤面を placeStone だけで作ると高確率で 5 連が生じるため、
    // 「5 連を含まないことが構造的に保証される充填パターン」で満杯盤面を組み立てる。
    // 使用するのは剪断（シアー）パターン color(row,col) = floor((2*row + col + offset)/2)
    // の偶奇である。offset を乱数で変えることで盤面に多様性を与える（offset は周期 4 で
    // 実質 4 種類の盤面を生む）。このパターンは横・縦・両斜めのいずれの直線上でも同色が
    // 5 つ連続しないことを、下記の実行時ガード（構成した満杯盤面上の全交点で
    // checkWin が false であること）で毎回確認する。万一パターンが 5 連を含んだ場合は
    // 別 offset で作り直し、それでも作れない場合はガードが例外を投げて誤った検証を防ぐ。
    //
    // 各反復の手順:
    //   1. 勝者を生じない充填パターンで満杯盤面を構成する。構成後に「全交点で
    //      checkWin === false」を確認し、勝者を含むなら別 offset で作り直す。
    //   2. ランダムに最後の着手交点 (fr,fc) を選ぶ。満杯盤面から (fr,fc) だけを空に
    //      戻した「最後の一手前」の盤面を作り、その交点に本来入る色を最後の手番とする。
    //   3. ガード: 最後の一手前の盤面が、埋まっている全交点で勝者を含まないことを
    //      アサートする（引き分け以外で終局する経路が無いことの担保）。
    //   4. placeStone(state, fr, fc) を呼び、result.valid === true かつ
    //      result.state.status === GameStatus.DRAW を検証する。
    // Validates: Requirements 5.1
    test('Property 7: 盤が満杯で勝者がいなければ引き分けになる', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };

      // 剪断パターンによる交点の色。offset で盤面に多様性を与える。
      // 2*row + col の傾きにより横・縦・両斜めのいずれでも同色は最大 2 連までとなり、
      // 5 連は構造的に生じない（実行時ガードで毎回検証する）。
      const patternColorOf = function (row, col, offset) {
        return (Math.floor((2 * row + col + offset) / 2) % 2 === 0)
          ? Color.BLACK
          : Color.WHITE;
      };
      const cellOf = function (row, col, offset) {
        return patternColorOf(row, col, offset) === Color.BLACK
          ? CellState.BLACK
          : CellState.WHITE;
      };

      // 充填パターンで満杯盤面を構成する。
      const buildFullBoard = function (offset) {
        const board = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
          const cells = [];
          for (let c = 0; c < BOARD_SIZE; c++) {
            cells.push(cellOf(r, c, offset));
          }
          board.push(cells);
        }
        return board;
      };

      // 盤上に石の置かれた交点で 1 つでも 5 連（勝者）があれば true。
      const boardHasAnyWinner = function (board) {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (board[r][c] !== CellState.EMPTY &&
              GoBoardLogic.checkWin(board, r, c)) {
              return true;
            }
          }
        }
        return false;
      };

      const ITERATIONS = 120; // 最低 100 回のランダム反復
      let checked = 0;
      let attempts = 0;
      const maxAttempts = ITERATIONS * 20; // 作り直しによる無限ループ防止
      while (checked < ITERATIONS && attempts < maxAttempts) {
        attempts++;

        // 1. 勝者を生じない充填パターンで満杯盤面を構成する。
        const offset = randomInt(1000000);
        const fullBoard = buildFullBoard(offset);
        // パターンが万一 5 連を含んだら、この offset は使わず作り直す。
        if (boardHasAnyWinner(fullBoard)) {
          continue;
        }

        // 2. 最後の着手交点 (fr,fc) をランダムに選び、そこだけ空に戻した
        //    「最後の一手前」の盤面と、その交点に本来入る色（＝最後の手番）を用意する。
        const fr = randomInt(BOARD_SIZE);
        const fc = randomInt(BOARD_SIZE);
        const finalColor = patternColorOf(fr, fc, offset);
        const preBoard = fullBoard.map(function (cells) {
          return cells.slice();
        });
        preBoard[fr][fc] = CellState.EMPTY;

        const ctx = 'offset=' + offset + ' final=(' + fr + ',' + fc + ')' +
          ' finalColor=' + finalColor;

        // 3. ガード: 最後の一手前の盤面は、埋まっている全交点で勝者を含まない。
        //    これにより、この盤面が終局する唯一の経路は引き分けであることを担保する。
        if (boardHasAnyWinner(preBoard)) {
          throw new Error('最後の一手前の盤面が勝者を含む（構成が不正）[' + ctx + ']');
        }

        // 4. 最後の交点へ着手する。満杯かつ勝者なしなので引き分けになる。
        const state = {
          board: preBoard,
          currentTurn: finalColor,
          status: GameStatus.IN_PROGRESS,
        };
        const result = GoBoardLogic.placeStone(state, fr, fc);

        assertEqual(result.valid, true, '最後の着手が有効 [' + ctx + ']');
        assertEqual(
          result.state.status,
          GameStatus.DRAW,
          '満杯・無勝者で引き分け [' + ctx + ']'
        );

        checked++;
      }

      // 引き分け成立を最低 100 回検証していることを確認する。
      assertEqual(checked >= 100, true, '最低 100 回の引き分け成立を検証 (検証 ' + checked + ' 回)');
    });

    /* --- findOpenThrees の例ベース単体テスト ------------------------
       盤面全体を走査して Open_Three（同色ちょうど 3 個連続かつ延長可能な端を持つ並び）を
       列挙する挙動を、決定的に構成した盤面で確認する。旧 detectOpenThrees（着手点ベース・
       成立方向配列）の単体テストは task 1.3 で本テストへ置換した。連続 3 の検出、両端が
       塞がれた連続 3 の除外、飛び三の非検出（旧セマンティクスの反転）を確認する。
       Validates: Requirements 1.1, 1.2 */

    // 空盤を 1 面作る補助。各テストで独立した盤面を用いる。
    function gbEmptyBoard() {
      return GoBoardLogic.createGame().board;
    }

    test('findOpenThrees: 連続 3（_ X X X _）を端が開いた Open_Three として検出', function () {
      // 横方向 (7,6)(7,7)(7,8) に黒 3 連。両端 (7,5)(7,9) は空で 4 連へ延長可能。
      const board = gbEmptyBoard();
      board[7][6] = CellState.BLACK;
      board[7][7] = CellState.BLACK;
      board[7][8] = CellState.BLACK;

      const threes = GoBoardLogic.findOpenThrees(board, Color.BLACK);

      assertEqual(threes.length, 1, 'Open_Three は 1 個');
      assertEqual(threes[0].color, Color.BLACK, '色は黒');
      // 構成 3 交点は昇順に正規化される。
      assertEqual(
        threes[0].cells,
        [{ row: 7, col: 6 }, { row: 7, col: 7 }, { row: 7, col: 8 }],
        '構成 3 交点が連続 3 と一致'
      );
    });

    test('findOpenThrees: 両端が塞がれた連続 3（O X X X O）は Open_Three と判定しない', function () {
      // 盤端で塞がれるケース: 左端に寄せた黒 3 連 (7,0)(7,1)(7,2)。
      // 左端 (7,-1) は盤外、右隣 (7,3) を白で塞ぐ。どちらの端も延長できない。
      const boardEdge = gbEmptyBoard();
      boardEdge[7][0] = CellState.BLACK;
      boardEdge[7][1] = CellState.BLACK;
      boardEdge[7][2] = CellState.BLACK;
      boardEdge[7][3] = CellState.WHITE;

      const edgeThrees = GoBoardLogic.findOpenThrees(boardEdge, Color.BLACK);
      assertEqual(edgeThrees.length, 0, '盤端＋相手石で両端塞がれた 3 連は非 Open_Three');

      // 相手石で両端を塞ぐケース: (7,6)(7,7)(7,8) の黒 3 連の両隣 (7,5)(7,9) を白。
      const boardBlocked = gbEmptyBoard();
      boardBlocked[7][5] = CellState.WHITE;
      boardBlocked[7][6] = CellState.BLACK;
      boardBlocked[7][7] = CellState.BLACK;
      boardBlocked[7][8] = CellState.BLACK;
      boardBlocked[7][9] = CellState.WHITE;

      const blockedThrees = GoBoardLogic.findOpenThrees(boardBlocked, Color.BLACK);
      assertEqual(blockedThrees.length, 0, '両端を相手石で塞がれた 3 連は非 Open_Three');
    });

    test('findOpenThrees: 飛び三（X X _ X）は Open_Three として返さない', function () {
      // 横方向 (7,5)(7,6) 石・(7,7) 空・(7,8) 石。内部に空を 1 か所挟む同色 3 個。
      // 旧セマンティクスでは飛び三を検出したが、新設計では連続 3 のみを Open_Three とし、
      // 飛び三は返さない（旧セマンティクスの反転を明示する）。
      const board = gbEmptyBoard();
      board[7][5] = CellState.BLACK;
      board[7][6] = CellState.BLACK;
      board[7][8] = CellState.BLACK;

      const threes = GoBoardLogic.findOpenThrees(board, Color.BLACK);

      assertEqual(threes.length, 0, '飛び三は Open_Three ではない');
    });

    /* --- isDoubleThree の例ベース単体テスト -------------------------
       着手点や方向ではなく、盤面全体に存在する当該色の Open_Three 総数で
       Double_Three を判定する。黒 Open_Three が 2 個ある盤面で true、1 個以下で
       false を返すこと、および互いに交わらない離れた 2 個でも true になることを
       検証する（新意味論: 全盤面個数ベース）。
       Validates: Requirements 1.1, 1.5 */

    test('isDoubleThree: 盤面全体に黒 Open_Three が 2 個ある盤面で true', function () {
      // 着手交点 (7,7) を中心に、横 (7,6)(7,7)(7,8) と縦 (6,7)(7,7)(8,7) の
      // 連続 3 を同時に構成する。両端は空で 4 連へ延長可能。盤面全体で黒の
      // Open_Three は横・縦の 2 個。
      const board = gbEmptyBoard();

      // 横方向の連続 3。
      board[7][6] = CellState.BLACK;
      board[7][7] = CellState.BLACK;
      board[7][8] = CellState.BLACK;
      // 縦方向の連続 3（(7,7) を共有）。
      board[6][7] = CellState.BLACK;
      board[8][7] = CellState.BLACK;

      const result = GoBoardLogic.isDoubleThree(board, Color.BLACK);

      assertEqual(result, true, '盤面全体の黒 Open_Three が 2 個なら Double_Three');
    });

    test('isDoubleThree: 盤面全体に黒 Open_Three が 1 個のみの盤面で false', function () {
      // 横 (7,6)(7,7)(7,8) の連続 3 のみ。盤面全体で黒 Open_Three は 1 個。
      const board = gbEmptyBoard();

      board[7][6] = CellState.BLACK;
      board[7][7] = CellState.BLACK;
      board[7][8] = CellState.BLACK;

      const result = GoBoardLogic.isDoubleThree(board, Color.BLACK);

      assertEqual(result, false, '盤面全体の黒 Open_Three が 1 個なら Double_Three ではない');
    });

    test('isDoubleThree: 黒 Open_Three が 0 個の空盤で false', function () {
      // 石が 1 つも無ければ Open_Three は成立しない。
      const board = gbEmptyBoard();

      const result = GoBoardLogic.isDoubleThree(board, Color.BLACK);

      assertEqual(result, false, '黒 Open_Three が 0 個なら Double_Three ではない');
    });

    test('isDoubleThree: 互いに交わらない離れた黒 Open_Three 2 個でも true', function () {
      // 交わらない 2 か所に横方向の連続 3 を配置する。両端は空で 4 連へ延長可能。
      // (2,2)(2,3)(2,4) と、遠く離れた (11,10)(11,11)(11,12)。共通の交点を持たない。
      const board = gbEmptyBoard();

      // 1 個目: 盤面上部の横連続 3。
      board[2][2] = CellState.BLACK;
      board[2][3] = CellState.BLACK;
      board[2][4] = CellState.BLACK;
      // 2 個目: 盤面下部の横連続 3（1 個目と交わらない離れた位置）。
      board[11][10] = CellState.BLACK;
      board[11][11] = CellState.BLACK;
      board[11][12] = CellState.BLACK;

      const result = GoBoardLogic.isDoubleThree(board, Color.BLACK);

      assertEqual(result, true, '離れて交わらない黒 Open_Three 2 個でも Double_Three');
    });

    /* --- computeThreeRegistry の例ベース単体テスト --------------------
       黒・白を区別した Three_Registry の再計算を、findOpenThrees ベースの新
       セマンティクスで確認する。空盤では黒・白とも 0 個であること、同一の連続 3 石を
       異なる走査経路（起点・方向）で数えても 1 件に重複排除されること、および飛び三が
       Registry に含まれないことを検証する。旧テストが参照していた findThreeInARow と
       単一飛び 3 の期待は task 2.2 で除去した。
       Validates: Requirements 2.1, 2.4 */

    /* --- applyMove（連続3の同時2箇所成立の禁止ラッパ）の例ベース単体テスト ------------

    test('applyMove: 黒の連続3が2箇所成立する着手を DOUBLE_THREE で拒否し盤面・手番を保持', function () {

      board[7][8] = CellState.BLACK;
      board[6][7] = CellState.BLACK;
      board[8][7] = CellState.BLACK;

    });

    /* --- local-rules プロパティテスト --------------------------------
       連続3の同時2箇所成立の禁止ローカルルールの追加純粋関数（applyMove / findOpenThrees /
       isDoubleThree / computeThreeRegistry）に対する Correctness Property（P1〜P10）を
       それぞれ 1 つのプロパティベーステスト（最低 100 回のランダム反復）として
       実装する。判定意味論は「確定後盤面全体の当該色 Open_Three 総数」に基づく。
       fixture 生成には GB_GEN の各ジェネレータを用いる。旧セマンティクス
       （着手点を通る方向数・飛び三）に依存するプロパティテストは撤去し、
       旧関数 detectOpenThrees / isDoubleThreeMove / findThreeInARow は参照しない。 */

    // Feature: local-rules, Property 1: 黒の連続3が2箇所成立する着手は無効となり状態を変えない
    // 任意の進行中 GameState と、Black_Player の手番における空交点への着手について、
    // その着手を適用した後の盤面全体に黒の Open_Three が合計 2 個以上存在し、かつ
    // Win_Condition を成立させないならば、applyMove の結果は valid=false・
    // reason=DOUBLE_THREE となり、盤面・Current_Turn・Game_Status・Three_Registry は
    // いずれも着手前と等しいまま保持される。着手点十字型と、離れた 2 個目型の双方の
    // fixture を交互に用いる。
    // Validates: Requirements 1.1, 4.1
    test('Property 1: 黒の連続3が2箇所成立する着手は無効となり状態を変えない', function () {
      const ITERATIONS = 120; // 最低 100 回のランダム反復
      let checked = 0;
      for (let iter = 0; iter < ITERATIONS; iter++) {
        // 着手点十字型（randomBlackDoubleThree）と離れた 2 個目型
        // （randomBlackDistantDoubleThree）を交互に用いる。
        const fx = (iter % 2 === 0)
          ? GB_GEN.randomBlackDoubleThree()
          : GB_GEN.randomBlackDistantDoubleThree();
        const state = {
          board: fx.board,
          currentTurn: Color.BLACK,
          status: GameStatus.IN_PROGRESS,
        };

        // 着手前のスナップショット（盤面・手番・状態・Three_Registry）。
        const preBoard = JSON.stringify(state.board);
        const preTurn = state.currentTurn;
        const preStatus = state.status;
        const preRegistry = JSON.stringify(GoBoardLogic.computeThreeRegistry(state.board));

        const result = GoBoardLogic.applyMove(state, fx.move.row, fx.move.col);

        const ctx = 'iter=' + iter + ' 着手=(' + fx.move.row + ',' + fx.move.col + ')';

        assertEqual(result.valid, false, '黒の連続3が2箇所成立する着手は無効 [' + ctx + ']');
        assertEqual(result.reason, InvalidReason.DOUBLE_THREE,
          '無効理由は DOUBLE_THREE [' + ctx + ']');

        // 状態は着手前と等しいまま保持される。
        assertEqual(JSON.stringify(result.state.board), preBoard,
          '盤面が着手前と同一 [' + ctx + ']');
        assertEqual(result.state.currentTurn, preTurn,
          'Current_Turn が着手前と同一 [' + ctx + ']');
        assertEqual(result.state.status, preStatus,
          'Game_Status が着手前と同一 [' + ctx + ']');
        assertEqual(JSON.stringify(result.registry), preRegistry,
          'Three_Registry が着手前と同一 [' + ctx + ']');

        checked++;
      }
      assertEqual(checked >= 100, true, '最低 100 回検証 (検証 ' + checked + ' 回)');
    });

    // Feature: local-rules, Property 2: 黒 Open_Three が 1 個以下となる着手は受理される
    // 任意の進行中 GameState と、Black_Player の空交点への着手について、その着手を
    // 適用した後の盤面全体に黒の Open_Three が合計 1 個以下しか存在せず、かつ
    // Win_Condition を成立させないならば、applyMove の結果は valid=true となり、当該

    // 「既存 1 個を保つ」型（randomBlackDistantAccept）を交互に用いる。
    // Validates: Requirements 1.2
    test('Property 2: 黒 Open_Three が 1 個以下となる着手は受理される', function () {
      const ITERATIONS = 120;
      let checked = 0;
      for (let iter = 0; iter < ITERATIONS; iter++) {

    // Feature: local-rules, Property 3: 白の連続3が2箇所成立する着手は受理される
    // 任意の進行中 GameState で Current_Turn が White_Player のとき、着手を適用した
    // 後の盤面全体に白の Open_Three が合計 2 個以上存在しても、applyMove は連続3の同時2箇所成立の禁止を
    // 適用せず valid=true となり、当該交点に白の Stone が配置される。
    // fixture は GB_GEN.randomWhiteDoubleThree() で構成する（currentTurn=WHITE）。
    // Validates: Requirements 1.3
    test('Property 3: 白の連続3が2箇所成立する着手は受理される', function () {

    // Feature: local-rules, Property 4: Win_Condition は連続3の同時2箇所成立の禁止より優先される
    // 任意の進行中 GameState と、Black_Player の空交点への着手について、その着手が
    // Double_Three（着手後の黒 Open_Three が 2 個以上）を成立させ、かつ同一の着手が
    // いずれかの Line 上で同色 5 個以上の連続（Win_Condition）を成立させるならば、
    // applyMove は valid=true となり、当該交点に黒の Stone を配置し、Game_Status を
    // BLACK_WIN に設定する。fixture は GB_GEN.randomBlackDoubleThreeWin() で構成する。
    // Validates: Requirements 1.4
    test('Property 4: Win_Condition は連続3の同時2箇所成立の禁止より優先される', function () {
      const ITERATIONS = 120;

    });

    // Feature: local-rules, Property 5: 有効着手後の Three_Registry は確定後盤面と一致する
    // 任意の有効な着手について、applyMove が返す Three_Registry の黒・白の各集合は、
    // 確定後盤面に対して computeThreeRegistry を独立に適用した結果と等しい（同一の
    // 位置集合を持つ）。有効着手の多様性を得るため、受理が保証された複数のジェネレータを
    // ローテーションで用いる。
    // Validates: Requirements 2.2
    test('Property 5: 有効着手後の Three_Registry は確定後盤面と一致する', function () {
      const ITERATIONS = 120;
      let checked = 0;
      for (let iter = 0; iter < ITERATIONS; iter++) {
        // 有効になることが保証された着手をローテーションで生成する。
        let fx;
        let turn;
        const kind = iter % 3;
        if (kind === 0) {
          fx = GB_GEN.randomBlackSingleOpenThree();
          turn = Color.BLACK;
        } else if (kind === 1) {
          fx = GB_GEN.randomWhiteDoubleThree();
          turn = Color.WHITE;
        } else {
          fx = GB_GEN.randomBlackDistantAccept();
          turn = Color.BLACK;
        }
        const state = {
          board: fx.board,
          currentTurn: turn,
          status: GameStatus.IN_PROGRESS,
        };

        const result = GoBoardLogic.applyMove(state, fx.move.row, fx.move.col);

        const ctx = 'iter=' + iter + ' 着手=(' + fx.move.row + ',' + fx.move.col +
          ') 手番=' + turn;

        // 前提: この着手は有効である。
        assertEqual(result.valid, true, '着手が有効 [' + ctx + ']');

        // 確定後盤面から独立に再計算した Three_Registry と一致する（黒・白とも）。
        const recomputed = GoBoardLogic.computeThreeRegistry(result.state.board);
        assertEqual(result.registry.black, recomputed.black,
          '黒の Three_Registry が確定後盤面と一致 [' + ctx + ']');
        assertEqual(result.registry.white, recomputed.white,
          '白の Three_Registry が確定後盤面と一致 [' + ctx + ']');

        checked++;
      }
      assertEqual(checked >= 100, true, '最低 100 回検証 (検証 ' + checked + ' 回)');
    });

    // Feature: local-rules, Property 6: 無効着手では Three_Registry が変化しない
    // 任意の無効な着手（既石・範囲外・不正座標・終局・黒の連続3が2箇所成立する着手のいずれか）について、
    // applyMove が返す Three_Registry は着手前の Three_Registry と等しいまま変化しない。
    // 5 カテゴリの無効着手をローテーションで生成し、valid=false と registry 不変を検証する。
    // Validates: Requirements 2.3, 3.4
    test('Property 6: 無効着手では Three_Registry が変化しない', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };
      // 盤面上の非空交点を 1 つ返す（無ければ null）。
      const anyOccupiedCell = function (board) {
        const cells = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (board[r][c] !== CellState.EMPTY) {
              cells.push({ row: r, col: c });
            }
          }
        }
        return cells.length === 0 ? null : cells[randomInt(cells.length)];
      };

      const ITERATIONS = 150; // 5 カテゴリを回すため多めに反復する
      let checked = 0;
      let attempts = 0;
      const maxAttempts = ITERATIONS * 10;
      while (checked < ITERATIONS && attempts < maxAttempts) {
        attempts++;
        const category = attempts % 5;

        let state;
        let move;
        let label;

        if (category === 0) {
          // 黒の連続3が2箇所成立する着手（DOUBLE_THREE）による無効。
          const fx = GB_GEN.randomBlackDoubleThree();
          state = { board: fx.board, currentTurn: Color.BLACK, status: GameStatus.IN_PROGRESS };
          move = { row: fx.move.row, col: fx.move.col };
          label = 'DOUBLE_THREE';
        } else if (category === 1) {
          // 既石（OCCUPIED）による無効。
          state = GB_GEN.randomInProgressState(20);
          const occ = anyOccupiedCell(state.board);
          if (occ === null) {
            continue; // 石が無い盤面はスキップして作り直す
          }
          move = occ;
          label = 'OCCUPIED';
        } else if (category === 2) {
          // 範囲外（OUT_OF_BOUNDS）による無効。
          state = GB_GEN.randomInProgressState(20);
          move = GB_GEN.randomOutOfBoundsCoord();
          label = 'OUT_OF_BOUNDS';
        } else if (category === 3) {
          // 不正座標（INVALID_COORDINATE）による無効。
          state = GB_GEN.randomInProgressState(20);
          move = GB_GEN.randomInvalidCoord();
          label = 'INVALID_COORDINATE';
        } else {
          // 終局（NOT_IN_PROGRESS）による無効。進行中状態を終局状態へ差し替える。
          const base = GB_GEN.randomInProgressState(20);
          state = { board: base.board, currentTurn: base.currentTurn, status: GameStatus.BLACK_WIN };
          move = GB_GEN.randomEmptyCell(state.board);
          if (move === null) {
            continue;
          }
          label = 'NOT_IN_PROGRESS';
        }

        // 着手前の Three_Registry をスナップショットする。
        const preRegistry = JSON.stringify(GoBoardLogic.computeThreeRegistry(state.board));

        const result = GoBoardLogic.applyMove(state, move.row, move.col);

        const ctx = label + ' 着手=(' + move.row + ',' + move.col + ')';

        assertEqual(result.valid, false, '無効な着手である [' + ctx + ']');
        assertEqual(JSON.stringify(result.registry), preRegistry,
          'Three_Registry が着手前と同一 [' + ctx + ']');

        checked++;
      }
      assertEqual(checked >= 100, true, '最低 100 回検証 (検証 ' + checked + ' 回)');
    });

    // Feature: local-rules, Property 7: Three_Registry は色ごとに分離され重複を持たない
    // 任意の盤面について、computeThreeRegistry が返す Three_Registry は、黒の集合には
    // 黒の Open_Three のみ・白の集合には白の Open_Three のみを含み、各集合内に同一の
    // Open_Three（同一の正規化キー）を重複して持たず、各要素は当該色の妥当な
    // Open_Three である。盤面は GB_GEN.randomInProgressState() で生成する。
    // Validates: Requirements 2.4
    test('Property 7: Three_Registry は色ごとに分離され重複を持たない', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };
      // 集合内の key に重複が無いことを確認する。
      const hasUniqueKeys = function (entries) {
        const seen = {};
        for (let i = 0; i < entries.length; i++) {
          const key = entries[i].key;
          if (Object.prototype.hasOwnProperty.call(seen, key)) {
            return false;
          }
          seen[key] = true;
        }
        return true;
      };

      const ITERATIONS = 120;
      let checked = 0;
      for (let iter = 0; iter < ITERATIONS; iter++) {
        const state = GB_GEN.randomInProgressState(randomInt(30));
        const registry = GoBoardLogic.computeThreeRegistry(state.board);

        const ctx = 'iter=' + iter +
          ' black=' + registry.black.length + ' white=' + registry.white.length;

        // 黒の集合には黒の Open_Three のみ。
        for (let i = 0; i < registry.black.length; i++) {
          assertEqual(registry.black[i].color, Color.BLACK,
            '黒集合の要素の色は BLACK [' + ctx + ']');
        }
        // 白の集合には白の Open_Three のみ。
        for (let i = 0; i < registry.white.length; i++) {
          assertEqual(registry.white[i].color, Color.WHITE,
            '白集合の要素の色は WHITE [' + ctx + ']');
        }
        // 各集合内で key は一意（重複を持たない）。
        assertEqual(hasUniqueKeys(registry.black), true,
          '黒集合内の key が一意 [' + ctx + ']');
        assertEqual(hasUniqueKeys(registry.white), true,
          '白集合内の key が一意 [' + ctx + ']');

        checked++;
      }
      assertEqual(checked >= 100, true, '最低 100 回検証 (検証 ' + checked + ' 回)');
    });

    // Feature: local-rules, Property 8: 検出される並びは常に延長可能な連続 3 の Open_Three である
    // 任意の盤面と色について、findOpenThrees(board, color) が返す各要素は、当該色の
    // ちょうど 3 個が Line 上で隙間なく連続し、かつ少なくとも一方の端が盤内の空
    // Intersection で延長可能な並びである。飛び三、および両端が相手 Stone・盤端で
    // 塞がれた連続 3 は返されない。ランダム進行中盤面を入力とし、旧 P8（方向を返す）を
    // 置換する。
    // Validates: Requirements 1.1, 2.2
    test('Property 8: 検出される並びは常に延長可能な連続 3 の Open_Three である', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };
      const inBoard = function (r, c) {
        return r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE;
      };
      const cellFor = function (color) {
        return color === Color.BLACK ? CellState.BLACK : CellState.WHITE;
      };

      const ITERATIONS = 130;
      let checked = 0;
      for (let iter = 0; iter < ITERATIONS; iter++) {
        const state = GB_GEN.randomInProgressState(randomInt(40));
        const board = state.board;
        const color = (randomInt(2) === 0) ? Color.BLACK : Color.WHITE;
        const stone = cellFor(color);
        const opponent = (color === Color.BLACK) ? CellState.WHITE : CellState.BLACK;

        const opens = GoBoardLogic.findOpenThrees(board, color);
        const ctx = 'iter=' + iter + ' color=' + color + ' count=' + opens.length;

        for (let i = 0; i < opens.length; i++) {
          const ot = opens[i];
          // 色は対象色。
          assertEqual(ot.color, color, '要素の色が対象色 [' + ctx + ']');
          // ちょうど 3 交点で構成される。
          assertEqual(ot.cells.length, 3, '構成は 3 交点 [' + ctx + ']');

          const cells = ot.cells;
          // 3 交点はすべて盤内かつ対象色の石である。
          let allStone = true;
          for (let k = 0; k < 3; k++) {
            const p = cells[k];
            if (!inBoard(p.row, p.col) || board[p.row][p.col] !== stone) {
              allStone = false;
            }
          }
          assertEqual(allStone, true, '3 交点すべてが対象色の石 [' + ctx + ']');

          // 隙間なく連続する（等間隔・一直線）。方向ベクトルは cells[1]-cells[0] で、
          // cells[2]-cells[1] と一致し、かつ単位ステップ（各成分が -1/0/1）である。
          const dr1 = cells[1].row - cells[0].row;
          const dc1 = cells[1].col - cells[0].col;
          const dr2 = cells[2].row - cells[1].row;
          const dc2 = cells[2].col - cells[1].col;
          const consecutive =
            (dr1 === dr2 && dc1 === dc2) &&
            (Math.abs(dr1) <= 1 && Math.abs(dc1) <= 1) &&
            !(dr1 === 0 && dc1 === 0);
          assertEqual(consecutive, true,
            '3 交点が隙間なく連続 [' + ctx + ' cells=' + JSON.stringify(cells) + ']');

          // 少なくとも一方の端が盤内かつ空で延長可能である（前端外側 or 後端外側）。
          const before = { row: cells[0].row - dr1, col: cells[0].col - dc1 };
          const after = { row: cells[2].row + dr1, col: cells[2].col + dc1 };
          const beforeOpen =
            inBoard(before.row, before.col) &&
            board[before.row][before.col] === CellState.EMPTY;
          const afterOpen =
            inBoard(after.row, after.col) &&
            board[after.row][after.col] === CellState.EMPTY;
          assertEqual(beforeOpen || afterOpen, true,
            '少なくとも一方の端が空で延長可能 [' + ctx + ']');

          // 相手石・盤端で両端が塞がれた連続 3 は返らない（上と同値だが明示検証）。
          const bothBlocked =
            (!inBoard(before.row, before.col) ||
              board[before.row][before.col] === opponent) &&
            (!inBoard(after.row, after.col) ||
              board[after.row][after.col] === opponent);
          assertEqual(bothBlocked, false, '両端閉塞の連続 3 は返らない [' + ctx + ']');
        }

        checked++;
      }
      assertEqual(checked >= 100, true, '最低 100 回検証 (検証 ' + checked + ' 回)');
    });

    // Feature: local-rules, Property 9: 黒の連続3が2箇所成立する着手以外では applyMove は placeStone と同一の可否・状態を返す
    // 任意の GameState と着手について、その着手が「Black_Player の連続3が2箇所成立する着手（着手後の黒
    // Open_Three が 2 個以上）かつ非 Win_Condition」に該当しないならば、applyMove の
    // valid・reason・state（board / currentTurn / status）は、既存 placeStone を同一
    // 入力で呼んだ結果と等しい。ランダム進行中盤面に対しランダムな着手（空交点・
    // 範囲外・不正座標）を与え、除外条件に該当する反復のみスキップする。
    // Validates: Requirements 5.2
    test('Property 9: 黒の連続3が2箇所成立する着手以外では applyMove は placeStone と同一の可否・状態を返す', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };
      // ランダムな着手座標を 3 カテゴリ（空交点・範囲外・不正座標）から選ぶ。
      const randomMove = function (board) {
        const kind = randomInt(3);
        if (kind === 0) {
          const empty = GB_GEN.randomEmptyCell(board);
          if (empty !== null) {
            return empty;
          }
          return GB_GEN.randomOutOfBoundsCoord();
        }
        if (kind === 1) {
          return GB_GEN.randomOutOfBoundsCoord();
        }
        return GB_GEN.randomInvalidCoord();
      };

      const ITERATIONS = 150;
      let checked = 0;
      let attempts = 0;
      const maxAttempts = ITERATIONS * 20;
      while (checked < ITERATIONS && attempts < maxAttempts) {
        attempts++;

        const state = GB_GEN.randomInProgressState(randomInt(30));
        const move = randomMove(state.board);

        // 除外判定: 「黒の連続3が2箇所成立する着手（着手後の黒 Open_Three が 2 個以上）かつ非 Win_Condition」に
        // 該当する着手はスキップ。placeStone が有効で、黒手番、着手後盤面の黒 Open_Three が
        // 2 個以上、かつ非勝ちなら除外対象。判定は確定後盤面全体の個数で行う。
        const probe = GoBoardLogic.placeStone(state, move.row, move.col);
        if (probe.valid && state.currentTurn === Color.BLACK) {
          const postBoard = probe.state.board;
          const win = probe.state.status === GameStatus.BLACK_WIN;
          if (!win && GoBoardLogic.isDoubleThree(postBoard, Color.BLACK)) {
            continue; // 黒の連続3が2箇所成立する着手（非 Win）は applyMove が placeStone と異なるため除外
          }
        }

        // applyMove と placeStone を同一入力で呼び、可否・理由・状態の一致を検証する。
        const applied = GoBoardLogic.applyMove(state, move.row, move.col);
        const placed = GoBoardLogic.placeStone(state, move.row, move.col);

        const ctx = '着手=(' + move.row + ',' + move.col + ') 手番=' + state.currentTurn;

        assertEqual(applied.valid, placed.valid, 'valid が一致 [' + ctx + ']');
        assertEqual(applied.reason, placed.reason, 'reason が一致 [' + ctx + ']');
        assertEqual(JSON.stringify(applied.state.board), JSON.stringify(placed.state.board),
          'board が一致 [' + ctx + ']');
        assertEqual(applied.state.currentTurn, placed.state.currentTurn,
          'currentTurn が一致 [' + ctx + ']');
        assertEqual(applied.state.status, placed.state.status,
          'status が一致 [' + ctx + ']');

        checked++;
      }
      assertEqual(checked >= 100, true, '最低 100 回検証 (検証 ' + checked + ' 回)');
    });

    // Feature: local-rules, Property 10: 禁止判定は Three_Registry の黒個数と一致する（唯一の情報源）
    // 任意の進行中 GameState と Black_Player の非 Win_Condition の空交点着手について、
    // applyMove が DOUBLE_THREE で拒否することと、確定後盤面に対する
    // computeThreeRegistry(board).black.length >= 2 が真であることは同値である。すなわち、
    // ログに出力される個数と禁止判定に用いる個数は常に一致する。連続3が2箇所成立する型・受理型の
    // fixture に加えランダム進行中盤面上の黒着手も入力し、両分岐を確実に踏む。
    // Validates: Requirements 1.1, 3.3
    test('Property 10: 禁止判定は Three_Registry の黒個数と一致する（唯一の情報源）', function () {
      const randomInt = function (n) {
        return Math.floor(Math.random() * n);
      };

      const ITERATIONS = 160; // スキップを見込み多めに反復する
      let checked = 0;
      let attempts = 0;
      const maxAttempts = ITERATIONS * 20;
      while (checked < ITERATIONS && attempts < maxAttempts) {
        attempts++;

        // 入力源をローテーションし、拒否分岐と受理分岐の双方を確実に踏む。
        let state;
        let move;
        const source = attempts % 4;
        if (source === 0) {
          const fx = GB_GEN.randomBlackDoubleThree();
          state = { board: fx.board, currentTurn: Color.BLACK, status: GameStatus.IN_PROGRESS };
          move = { row: fx.move.row, col: fx.move.col };
        } else if (source === 1) {
          const fx = GB_GEN.randomBlackDistantDoubleThree();
          state = { board: fx.board, currentTurn: Color.BLACK, status: GameStatus.IN_PROGRESS };
          move = { row: fx.move.row, col: fx.move.col };
        } else if (source === 2) {
          const fx = GB_GEN.randomBlackSingleOpenThree();
          state = { board: fx.board, currentTurn: Color.BLACK, status: GameStatus.IN_PROGRESS };
          move = { row: fx.move.row, col: fx.move.col };
        } else {
          // ランダム進行中盤面上の黒手番・空交点着手。
          const base = GB_GEN.randomInProgressState(randomInt(30));
          state = { board: base.board, currentTurn: Color.BLACK, status: GameStatus.IN_PROGRESS };
          const empty = GB_GEN.randomEmptyCell(state.board);
          if (empty === null) {
            continue;
          }
          move = empty;
        }

        // 前提: 黒手番・進行中・空交点で、着手が有効（placeStone が受理）かつ非 Win。
        const probe = GoBoardLogic.placeStone(state, move.row, move.col);
        if (!probe.valid) {
          continue; // 既石・範囲外・不正座標などは対象外
        }
        if (probe.state.status === GameStatus.BLACK_WIN) {
          continue; // Win_Condition は連続3の同時2箇所成立の禁止より優先されるため対象外
        }

        // 確定後盤面全体の黒 Open_Three 個数（唯一の情報源）。
        const blackCount = GoBoardLogic.computeThreeRegistry(probe.state.board).black.length;
        const expectRejected = blackCount >= 2;

        const result = GoBoardLogic.applyMove(state, move.row, move.col);
        const rejectedByDoubleThree =
          result.valid === false && result.reason === InvalidReason.DOUBLE_THREE;

        const ctx = 'src=' + source + ' 着手=(' + move.row + ',' + move.col +
          ') blackCount=' + blackCount;

        // 拒否と「黒個数 >= 2」は同値。
        assertEqual(rejectedByDoubleThree, expectRejected,
          'DOUBLE_THREE 拒否 ⇔ 黒 Open_Three 個数>=2 [' + ctx + ']');

        checked++;
      }
      assertEqual(checked >= 100, true, '最低 100 回検証 (検証 ' + checked + ' 回)');
    });

    // === 旧プロパティテスト（撤去済み） ===============================
    // 旧 Property 1〜9（着手点を通る方向数・単方向・detectOpenThrees の方向集合等の
    // 旧セマンティクスに基づくもの）は、上の P1〜P10 に置き換えて撤去した。
    // 特に旧「Property 8: detectOpenThrees は相異なる方向を返す」は Property 8
    // （延長可能な連続 3 の Open_Three 検証）へ置換済み。

    /* -------------------------------------------------------------------
       UI コントローラ（表示・入力層 / DOM 依存・テスト対象外）
       GoBoardLogic の純粋関数が返す GameState を DOM に描画する。
       ここでは Task 7.1 として盤面描画・ステータス表示・UI 初期化を実装する。
       クリックハンドリング（Task 7.2）とページ読み込み時の起動順（Task 7.3）は
       後続タスクで配線するため、ここでは関数の定義のみとし自動実行はしない。
       ------------------------------------------------------------------- */

    /** DOM 要素のキャッシュ。initUI 時に解決する。 */
    let gbBoardEl = null;
    let gbStatusEl = null;
    let gbNoticeEl = null;

    /** クリック配線を一度だけ行うためのフラグ（再描画で重複登録しない）。 */
    let gbEventsWired = false;

    /** 現在表示中のゲーム状態（GameState）。initUI で生成する。 */
    let gbState = null;

    /**
     * 現在の Three_Registry（黒・白それぞれの Three_In_A_Row 集合）。
     * initUI で computeThreeRegistry により初期化し、有効着手のたびに applyMove の
     * 返す registry で置き換える。
     */
    let gbRegistry = null;

    /**
     * Game_Status を人間が読めるラベルへ変換する。
     * 進行中は手番（黒番／白番）も併記する。
     * @param {{currentTurn: string, status: string}} state 表示対象の GameState
     * @returns {string} 表示用テキスト
     */
    function gbStatusText(state) {
      switch (state.status) {
        case GameStatus.BLACK_WIN:
          return '黒の勝ち';
        case GameStatus.WHITE_WIN:
          return '白の勝ち';
        case GameStatus.DRAW:
          return '引き分け';
        case GameStatus.IN_PROGRESS:
        default:
          return state.currentTurn === Color.BLACK
            ? '進行中（黒番）'
            : '進行中（白番）';
      }
    }

    /**
     * 現在の Game_Status を #gb-status に表示する。（Requirements 5.2）
     * @param {{currentTurn: string, status: string}} state 表示対象の GameState
     */
    function renderStatus(state) {
      if (!gbStatusEl) {
        return;
      }
      gbStatusEl.textContent = gbStatusText(state);
    }

    /**
     * 与えられた GameState の盤面を #gb-board に描画する。
     * 15×15＝225 の交点をクリック可能なセルとして生成し、各セルには後続タスク
     * （7.2 のクリック配線）が参照できるよう data-row / data-col を付与する。
     * 交点の状態（EMPTY / BLACK / WHITE）に応じて石を重ねる。ここではクリック
     * ハンドラは登録しない（Task 7.2）。
     * @param {{board: string[][]}} state 描画対象の GameState
     */
    function renderBoard(state) {
      if (!gbBoardEl) {
        return;
      }

      // 既存の描画をクリアしてから作り直す（イミュータブルな再描画）。
      gbBoardEl.textContent = '';

      const board = state.board;
      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'gb-cell';
          cell.dataset.row = String(row);
          cell.dataset.col = String(col);
          cell.setAttribute(
            'aria-label',
            '交点 ' + row + ',' + col
          );

          const cellState = board[row][col];
          if (cellState === CellState.BLACK || cellState === CellState.WHITE) {
            const stone = document.createElement('span');
            stone.className = 'gb-stone ' +
              (cellState === CellState.BLACK ? 'gb-stone-black' : 'gb-stone-white');
            cell.appendChild(stone);
          }

          gbBoardEl.appendChild(cell);
        }
      }
    }

    /**
     * 着手拒否の理由コード（InvalidReason）を人間が読める日本語メッセージへ変換する。
     * 盤上のクリックでは通常 OCCUPIED または NOT_IN_PROGRESS のみが発生するが、
     * 想定外の理由（範囲外・不正座標）も安全に汎用メッセージへ写像する。
     * @param {string} reason InvalidReason のいずれか
     * @returns {string} 表示用メッセージ
     */
    function reasonToMessage(reason) {
      switch (reason) {
        case InvalidReason.DOUBLE_THREE:
          return 'その手では両端の空いた3個の連続が同時に2か所できるため置けません';
        case InvalidReason.OCCUPIED:
          return 'そこには既に石があります';
        case InvalidReason.NOT_IN_PROGRESS:
          return '対局は既に終了しています';
        case InvalidReason.OUT_OF_BOUNDS:
        case InvalidReason.INVALID_COORDINATE:
        default:
          return 'その場所には石を置けません';
      }
    }

    /**
     * 通知領域（#gb-notice）にメッセージを表示する。
     * message が空文字なら通知をクリアする。
     * @param {string} message 表示するメッセージ（空文字でクリア）
     */
    function renderNotice(message) {
      if (!gbNoticeEl) {
        return;
      }
      gbNoticeEl.textContent = message || '';
    }

    /**
     * 盤面とステータスをまとめて再描画する。
     * 正常な再描画のたびに通知領域はクリアされ、直前の拒否メッセージが残らない。
     * @param {{board: string[][], currentTurn: string, status: string}} state GameState
     */
    function render(state) {
      renderBoard(state);
      renderStatus(state);
      renderNotice('');
    }

    /**
     * 有効着手の確定後に、更新された Three_Registry を用いて黒・白それぞれの
     * Three_In_A_Row の有無を console.log に 1 行ずつ出力する。1 つ以上存在する
     * 色については個数も含める。無効着手時には呼び出さない（有無ログを出さない）。
     * @param {{black:Object[], white:Object[]}} registry 更新後の Three_Registry
     */
    function logThreeInARow(registry) {
      const blackCount = registry.black.length;
      const whiteCount = registry.white.length;
      console.log(blackCount > 0
        ? '黒の Three_In_A_Row: あり（' + blackCount + '個）'
        : '黒の Three_In_A_Row: なし');
      console.log(whiteCount > 0
        ? '白の Three_In_A_Row: あり（' + whiteCount + '個）'
        : '白の Three_In_A_Row: なし');
    }

    /**
     * 盤面クリックのハンドラ。イベント委譲で #gb-board 上に一度だけ登録する。
     * クリックされたセル（.gb-cell）の data-row / data-col を整数として読み取り、
     * GoBoardLogic.applyMove(gbState, row, col) を呼ぶ（連続3の同時2箇所成立の禁止ローカルルールを含む）。
     * - 有効な着手: gbState を返却状態へ更新し、gbRegistry を返却 registry へ更新し、
     *   盤面・ステータスを再描画する（再描画により通知はクリアされる）。あわせて
     *   黒・白それぞれの Three_In_A_Row の有無を console.log に出力する。
     * - 無効な着手: gbState / gbRegistry は変更せず、理由に応じた日本語メッセージを通知する。
     *   終局後（NOT_IN_PROGRESS）のクリックも安全に拒否され、通知のみ行う。
     * @param {MouseEvent} event クリックイベント
     */
    function handleBoardClick(event) {
      // クリック対象から最も近いセル要素を探す（石 span をクリックした場合も含む）。
      const target = event.target;
      const cell = target && target.closest ? target.closest('.gb-cell') : null;
      if (!cell || !gbBoardEl.contains(cell)) {
        return;
      }

      const row = parseInt(cell.dataset.row, 10);
      const col = parseInt(cell.dataset.col, 10);

      const result = GoBoardLogic.applyMove(gbState, row, col);
      if (result.valid) {
        gbState = result.state;
        gbRegistry = result.registry;
        render(gbState);
        // 有効着手の確定後にのみ Three_In_A_Row の有無を出力する（無効着手では出さない）。
        logThreeInARow(gbRegistry);
      } else {
        renderNotice(reasonToMessage(result.reason));
      }
    }

    /**
     * UI のイベントを配線する。盤面クリックは #gb-board へのイベント委譲で
     * 一度だけ登録し、再描画でセルを作り直しても重複登録が起きないようにする。
     */
    function wireEvents() {
      if (gbEventsWired || !gbBoardEl) {
        return;
      }
      gbBoardEl.addEventListener('click', handleBoardClick);
      gbEventsWired = true;
    }

    /**
     * UI を初期化する。DOM 要素を解決し、クリック配線を行い、
     * GoBoardLogic.createGame() で新しいゲームを生成して gbState に保持し、
     * 初期状態を描画する。
     * ページ読み込み時の呼び出し（テスト実行後の初期化）は Task 7.3 で配線する。
     */
    function initUI() {
      gbBoardEl = document.getElementById('gb-board');
      gbStatusEl = document.getElementById('gb-status');
      gbNoticeEl = document.getElementById('gb-notice');
      wireEvents();
      gbState = GoBoardLogic.createGame();
      // 初期 Three_Registry を空盤から構築する（黒・白とも 0 個）。
      gbRegistry = GoBoardLogic.computeThreeRegistry(gbState.board);
      render(gbState);
    }

    /* -------------------------------------------------------------------
       Startup（ページ読み込み時の起動配線）
       起動順は「runTests() → initUI()」の順で行う（要件 7.1）。
       - まずテストを同期実行し、各結果とサマリを console.log に出力する。
       - テストは try/catch で囲み、万一例外が投げられても UI 初期化を止めない
         （要件 7.5）。runTests 自体は例外を投げない設計だが、防御的に囲む。
       - テストの成否にかかわらず initUI() を呼び、ゲーム生成・盤面描画・
         イベント配線を行う。
       ------------------------------------------------------------------- */
    function startup() {
      // 1. UI 初期化より前にテストを同期実行する（要件 7.1）。
      //    テストの失敗は UI 初期化を妨げてはならない（要件 7.5）。
      try {
        runTests();
      } catch (error) {
        // runTests は例外を投げない設計だが、防御的に握りつぶして続行する。
        console.log('[WARN] runTests threw unexpectedly: ' +
          ((error && error.message) ? error.message : String(error)));
      }
      // 2. テストの成否にかかわらず UI を初期化する。
      initUI();
    }

    // readyState を見て堅牢に起動する。<script> は body 末尾にあり対象要素は
    // 既に存在するが、「ページ読み込み完了時」の要件を満たすため readyState 判定を行う。
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startup);
    } else {
      startup();
    }
  </script>
</body>
</html>
